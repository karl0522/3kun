<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>昆特牌 · 手机版</title>
<style>
:root{
	--gold:#d4af37; --gold-soft:#b8943a; --gold-dim:#8a6d2f;
	--ink:#f0e6d2; --ink-dim:#b8a97f;
	--bg:#0b0a09; --bg2:#151311; --bg3:#1f1b17;
	--line:rgba(212,175,55,.25);
	--red:#a33; --green:#5a8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#000;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column}

/* ========== 主舞台（方案B 炉石式） ========== */
#app{position:fixed;inset:0;overflow:hidden;
	background:linear-gradient(180deg,#1b1713 0%,#0e0c0a 55%,#12100d 100%)}
#app::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 15%,rgba(120,90,40,.12),transparent 50%);pointer-events:none}

/* 对手条 */
#opbar{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;height:48px;display:flex;align-items:center;background:linear-gradient(180deg,rgba(30,26,22,.92),rgba(18,16,13,.9));border:1px solid var(--line);border-radius:12px;padding:0 10px;z-index:10}
.ava{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold-dim);background-size:150% auto;background-position:50% 6%;background-repeat:no-repeat;flex-shrink:0}
.opname{margin-left:8px;font-size:12px;color:var(--ink);line-height:1.2}
.opname small{display:block;font-size:9px;color:var(--ink-dim)}
.hud{display:flex;align-items:center;gap:10px;margin-left:auto}
.hud .it{display:flex;flex-direction:column;align-items:center;color:var(--ink-dim);font-size:8px;line-height:1.1;gap:2px}
.hud .it b{color:var(--ink);font-size:14px}
/* 对手总分徽章：与下方我方总战力 #tot 同色系（金框深底），方便一眼对比双方分数 */
.hud .it.score b{background:rgba(0,0,0,.55);border:1.5px solid var(--gold-dim);color:var(--gold);border-radius:6px;padding:1px 9px;font-size:14px;line-height:1.6}
.gems{display:flex;gap:2px}
.gem{width:11px;height:11px;border-radius:50%;background:#5a1010;border:1px solid #300}
.gem.on{background:linear-gradient(135deg,#d22,#700)}

/* 战场行 */
.field{position:absolute;left:10px;right:10px;display:flex;flex-direction:column;justify-content:space-between;z-index:5}
#fop{top:64px;height:138px}
#fme{top:286px;height:228px}
.crow{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:8px;display:flex;align-items:center;padding:0 8px;position:relative;transition:border-color .2s, box-shadow .2s}
#fop .crow{height:42px}
#fme .crow{height:72px;background:rgba(60,48,28,.16);border:1px solid rgba(212,175,55,.18)}
.crow.target{border-color:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.4);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(212,175,55,.3)}50%{box-shadow:0 0 18px rgba(212,175,55,.6)}}
.crow .lab{width:36px;font-size:9px;color:var(--ink-dim);flex-shrink:0}
.crow .cards{flex:1;display:flex;justify-content:flex-start;align-items:center;gap:4px;overflow:hidden}
#fop .crow .card{width:30px;height:40px}
#fme .crow .card{width:48px;height:66px}
.crow .rsc{width:26px;height:24px;margin-left:auto;flex-shrink:0;border-radius:6px;color:#000;font-weight:bold;font-size:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.3)}

/* 天气 */
#weather{position:absolute;top:210px;left:20%;right:20%;height:18px;display:flex;justify-content:center;gap:6px;z-index:6}
.wcard{width:44px;height:18px;border-radius:4px;background-size:cover;background-position:center;border:1px solid rgba(160,190,230,.4);box-shadow:0 0 5px rgba(150,180,220,.3)}

/* 卡牌通用 */
.card{position:relative;border-radius:5px;background-size:cover;background-position:center;box-shadow:0 1px 3px rgba(0,0,0,.6);flex-shrink:0;transition:transform .15s, box-shadow .15s;cursor:pointer}
.card:active{transform:scale(.95)}
.card .pw{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:bold;min-width:16px;text-align:center;padding:0 2px;border-radius:4px;border:1px solid rgba(255,255,255,.25);line-height:16px;z-index:4}
.card.hero .pw{color:#000;background:linear-gradient(135deg,#f0d860,#c8a030);border-color:#8a6d2f}
.card.special .pw,.card.weather .pw{display:none}

/* 行图标（战力数字下面，左侧垂直排列第二位） */
.card .row-icon{
	position:absolute;left:3px;top:24px;
	width:18px;height:18px;
	pointer-events:none;z-index:3;
}
.card .row-icon img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
/* 能力图标（行图标下面，左侧垂直排列第三位，可多个纵向堆叠） */
.card .ability-icon{
	position:absolute;left:3px;top:46px;
	display:flex;flex-direction:column;gap:3px;
	pointer-events:none;z-index:3;
}
.card .ability-icon .ai{width:16px;height:16px;}
.card .ability-icon .ai img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
/* 天气卡：天气图标直接放左上角（无战力无行图标） */
.card.weather .row-icon{top:3px;}
/* 特殊卡：能力图标直接放左上角（无战力无行图标） */
.card.special .ability-icon{top:3px;}

.card.just-played{animation:playIn .5s ease}
@keyframes playIn{0%{transform:translateY(-40px) scale(.5);opacity:0}60%{transform:translateY(4px) scale(1.08)}100%{transform:translateY(0) scale(1);opacity:1}}

/* 稀有度标识：金卡/银卡/特殊/天气（仅边框+光晕） */
.card.rarity-gold{border:2px solid #e8c84a !important;box-shadow:0 0 8px rgba(232,200,74,.55), inset 0 0 6px rgba(232,200,74,.25)}
.card.rarity-silver{border:1px solid #b8c0cc !important;box-shadow:0 0 4px rgba(180,190,210,.3)}
.card.rarity-special{border:1px solid #a060d0 !important;box-shadow:0 0 5px rgba(160,96,208,.4)}
.card.rarity-weather{border:1px solid #5a9ad0 !important;box-shadow:0 0 5px rgba(90,154,208,.4)}

/* 不同尺寸适配（垂直图标列） */
/* 对手战场卡 30x40 */
#fop .crow .card .pw{font-size:8px;min-width:11px;line-height:11px;left:2px;top:2px}
#fop .crow .card .row-icon{top:17px;left:2px;width:11px;height:11px}
#fop .crow .card .ability-icon{display:none}
#fop .crow .card.weather .row-icon{top:2px}
/* 我方战场卡 48x66 */
#fme .crow .card .pw{font-size:10px;min-width:14px;line-height:14px}
#fme .crow .card .row-icon{top:21px;width:14px;height:14px}
#fme .crow .card .ability-icon{top:39px;gap:2px}
#fme .crow .card .ability-icon .ai{width:12px;height:12px}
#fme .crow .card.weather .row-icon{top:3px}
#fme .crow .card.special .ability-icon{top:3px}
/* 底部手牌扇形卡 56x84 */
#handStack .card .pw{font-size:10px;min-width:14px;line-height:14px}
#handStack .card .row-icon{top:22px;width:14px;height:14px}
#handStack .card .ability-icon{display:none}
#handStack .card.weather .row-icon{top:3px}
/* 手牌卡 72x104 */
#handCards .card .row-icon{width:17px;height:17px;top:23px}
#handCards .card .ability-icon{top:44px}
#handCards .card.weather .row-icon{top:3px}
#handCards .card.special .ability-icon{top:3px}

/* 我方操作条 */
#mebar{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 100px);height:52px;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(30,26,22,.95),rgba(16,14,12,.95));border:1px solid var(--line);border-radius:12px;padding:0 10px;z-index:10}
#leader{width:42px;height:42px;border-radius:8px;background-size:150% auto;background-position:50% 6%;background-repeat:no-repeat;border:2px solid var(--gold-dim);flex-shrink:0;cursor:pointer;transition:transform .15s}
#leader:active{transform:scale(.92)}
#leader.ready{border-color:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.6)}
#leader.used{filter:grayscale(1) brightness(.5)}
#mestats{margin-left:4px;font-size:10px;color:var(--ink-dim);line-height:1.4;flex:1}
#mestats b{color:var(--ink);font-size:13px}
#pass{margin-left:auto;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8b14a,#7a5d16);color:#231a05;font-weight:bold;font-size:12px;border:2px solid #4a3a10;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
#pass:active{transform:scale(.92)}
#pass.passed{background:radial-gradient(circle at 35% 30%,#666,#333);color:#999;border-color:#222}
#tot{width:54px;height:46px;border-radius:8px;background:rgba(0,0,0,.55);border:2px solid var(--gold-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
#tot b{color:var(--gold);font-size:15px}
#tot span{font-size:7px;color:var(--ink-dim)}

/* 手牌扇形：铺满底部左侧空白区，卡牌互相叠放，点任意一张展开手牌面板 */
#handStack{position:absolute;left:10px;right:84px;bottom:calc(env(safe-area-inset-bottom) + 8px);height:84px;z-index:20;cursor:pointer}
#handStack .card{position:absolute;bottom:0;width:56px;height:84px;border:1px solid rgba(255,255,255,.14);transition:transform .2s}
#handStack .card:active{transform:translateY(-6px)}
#handStack .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-dim);letter-spacing:1px;border:1px dashed rgba(255,255,255,.12);border-radius:8px}

/* 弃牌堆：底部最右 */
#discardPile{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 8px);width:60px;height:84px;z-index:20;border-radius:6px;border:1px dashed rgba(212,175,55,.45);background:rgba(0,0,0,.3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden}
#discardPile.has{border:1px solid var(--gold-dim)}
#discardPile .dp-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.6))}
#discardPile .dp-label{position:relative;font-size:10px;color:var(--ink);letter-spacing:1px;text-shadow:0 1px 2px #000}
#discardPile .dp-count{position:relative;font-size:22px;font-weight:bold;color:var(--gold);text-shadow:0 1px 3px #000;line-height:1.2}

/* ========== 手牌展开面板 ========== */
#handPanel{position:fixed;left:0;right:0;bottom:0;z-index:100;background:linear-gradient(180deg,rgba(10,9,8,.92),rgba(16,14,12,.98));border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
#handPanel.open{transform:translateY(0)}
#handPanelBar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
#handPanelBar .title{font-size:13px;color:var(--gold);letter-spacing:2px}
#handPanelBar .count{font-size:11px;color:var(--ink-dim)}
#handClose{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);font-size:11px;padding:4px 12px;border-radius:12px;cursor:pointer}
#handCards{display:flex;gap:8px;padding:14px 26px 8px 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;min-height:168px;align-items:flex-end;scroll-snap-type:x proximity}
#handCards::-webkit-scrollbar{display:none}
#handCards .hc{flex-shrink:0;width:72px;display:flex;flex-direction:column;align-items:stretch;cursor:pointer;scroll-snap-align:start;transition:transform .15s}
#handCards .hc.selected{transform:translateY(-10px)}
#handCards .card{width:72px;height:104px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
#handCards .hc.selected .card{box-shadow:0 0 16px rgba(212,175,55,.7);border-color:var(--gold)}
/* 卡牌名称（大）+ 技能名称（小） */
.cap{margin-top:4px;text-align:center;width:100%}
.cap .cn{font-size:13px;font-weight:bold;color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .cn.long{font-size:11px}
.cap .ca{font-size:9.5px;color:var(--gold-soft);line-height:1.25;min-height:12px;max-height:24px;overflow:hidden}
#handCards .hc.selected .cap .cn{color:var(--gold)}
/* 缺图占位卡面：阵营渐变底 + 首字 + 名称 */
.noart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:rgba(255,255,255,.88);text-shadow:0 1px 3px #000;z-index:1;overflow:hidden}
.noart i{font-style:normal;font-weight:bold;font-size:26px;opacity:.45;line-height:1}
.noart span{font-size:9px;margin-top:3px;text-align:center;padding:0 2px;line-height:1.15}
#fop .noart i{font-size:15px}
#fop .noart span{display:none}
#fme .noart i{font-size:22px}
#fme .noart span{font-size:8px}
#handStack .noart i{font-size:24px}
#handStack .noart span{display:none}
#handCards .noart i{font-size:34px}
#handCards .noart span{font-size:11px}
#detailBar .noart i{font-size:30px}
#detailBar .noart span{display:none}
#cardModal .noart i{font-size:90px}
#cardModal .noart span{font-size:20px;margin-top:8px}
#handCards .card .pw{font-size:11px;min-width:16px;line-height:16px}

/* 详情条 */
#detailBar{padding:8px 14px 12px;border-top:1px solid rgba(255,255,255,.06);min-height:64px;display:flex;align-items:center;gap:10px}
#detailBar .thumb{width:56px;height:80px;border-radius:6px;background-size:cover;background-position:center;flex-shrink:0;position:relative;overflow:hidden;border:2px solid var(--gold-dim);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#detailBar .thumb.gold{border-color:#e8c84a;box-shadow:0 0 10px rgba(232,200,74,.5)}
#detailBar .thumb.silver{border-color:#b8c0cc}
#detailBar .thumb.special{border-color:#a060d0;box-shadow:0 0 8px rgba(160,96,208,.4)}
#detailBar .thumb.weather{border-color:#5a9ad0;box-shadow:0 0 8px rgba(90,154,208,.4)}
#detailBar .thumb .tpw{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#f0d860,#a8821a);color:#2a1a05;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:1px solid #4a3a10;box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:3}
#detailBar .thumb .tname{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));color:#fff;font-size:9px;text-align:center;padding:10px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;z-index:2}
#detailBar .thumb .row-icon{position:absolute;left:3px;top:26px;width:20px;height:20px;z-index:3}
#detailBar .thumb .row-icon img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#detailBar .thumb .ability-icon{position:absolute;left:3px;top:50px;display:flex;flex-direction:column;gap:3px;z-index:3}
#detailBar .thumb .ability-icon .ai{width:18px;height:18px}
#detailBar .thumb .ability-icon .ai img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
#detailBar .thumb.weather .row-icon{top:3px}
#detailBar .thumb.special .ability-icon{top:3px}
#detailBar .info{flex:1;min-width:0}
#detailBar .info .n{font-size:13px;color:var(--ink);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detailBar .info .meta{font-size:10px;color:var(--ink-dim);margin-top:2px}
#detailBar .info .desc{font-size:10px;color:var(--gold-soft);margin-top:3px;line-height:1.4}
#detailBar .playBtn{background:radial-gradient(circle at 35% 30%,#e0b950,#7a5d16);color:#231a05;font-weight:bold;font-size:18px;letter-spacing:3px;border:2px solid #4a3a10;border-radius:28px;min-width:104px;min-height:52px;padding:12px 26px;cursor:pointer;flex-shrink:0;transition:transform .15s;box-shadow:0 3px 12px rgba(0,0,0,.5)}
#detailBar .playBtn:active{transform:scale(.92)}
#detailBar.empty{justify-content:center;color:#555;font-size:11px}

/* 遮罩 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
#mask.show{opacity:1;pointer-events:auto}

/* ========== 卡牌详情浮层 ========== */
#cardModal{position:fixed;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
#cardModal.show{opacity:1;pointer-events:auto}
#cardModal .box{background:linear-gradient(180deg,#1a1612,#0e0c0a);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:300px;width:80%;text-align:center;transform:scale(.9);transition:transform .25s}
#cardModal.show .box{transform:scale(1)}
#cardModal .bigcard{width:180px;height:260px;margin:0 auto 12px;border-radius:8px;background-size:cover;background-position:center;border:2px solid var(--gold-dim);box-shadow:0 4px 20px rgba(0,0,0,.6)}
#cardModal .cname{font-size:16px;color:var(--ink);font-weight:bold;margin-bottom:6px}
#cardModal .cmeta{font-size:11px;color:var(--ink-dim);margin-bottom:8px}
#cardModal .cmeta span{margin:0 4px}
#cardModal .cdesc{font-size:12px;color:var(--gold-soft);line-height:1.6;margin-bottom:12px}
#cardModal .cclose{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);font-size:12px;padding:6px 24px;border-radius:14px;cursor:pointer}

/* Toast */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.85);color:var(--ink);font-size:14px;padding:12px 24px;border-radius:10px;border:1px solid var(--line);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 回合指示 */
#turnTag{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--gold);color:#231a05;font-size:10px;font-weight:bold;padding:2px 10px;border-radius:8px;z-index:11;letter-spacing:1px}

/* ========== 开始界面 ========== */
#startScreen{position:fixed;inset:0;z-index:500;background:radial-gradient(ellipse at 50% 30%,#2a2318 0%,#12100d 60%,#080706 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:opacity .4s}
#startScreen.hide{opacity:0;pointer-events:none}
#startScreen .logo{font-size:42px;font-weight:bold;color:var(--gold);letter-spacing:8px;text-shadow:0 0 20px rgba(212,175,55,.4);margin-bottom:4px}
#startScreen .sub{font-size:13px;color:var(--ink-dim);letter-spacing:4px;margin-bottom:40px}
#startScreen .section-title{font-size:14px;color:var(--ink);margin-bottom:14px;letter-spacing:2px}
#diffList{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin-bottom:30px}
.diffBtn{background:rgba(20,18,15,.8);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s;text-align:left}
.diffBtn:active{transform:scale(.98)}
.diffBtn.on{border-color:var(--gold);background:rgba(212,175,55,.1);box-shadow:0 0 12px rgba(212,175,55,.2)}
.diffBtn .dname{font-size:15px;font-weight:bold;color:var(--ink);margin-bottom:3px}
.diffBtn.on .dname{color:var(--gold)}
.diffBtn .ddesc{font-size:11px;color:var(--ink-dim);line-height:1.4}
.diffBtn .dtag{float:right;font-size:10px;padding:2px 8px;border-radius:8px;margin-top:2px}
.diffBtn[data-diff="easy"] .dtag{background:#3a6b3a;color:#8f8}
.diffBtn[data-diff="normal"] .dtag{background:#6b5a3a;color:#fd8}
.diffBtn[data-diff="hard"] .dtag{background:#6b3a3a;color:#f88}

/* ========== 选择牌组界面 ========== */

#handStack .card.ghost{animation:handOut .8s ease forwards;pointer-events:none;z-index:5;box-shadow:0 0 10px rgba(224,80,70,.9);border-color:#e05046}
@keyframes handOut{0%{transform:none;opacity:1}30%{transform:translateY(-22px) scale(1.08);opacity:1}100%{transform:translateY(-70px) scale(.6);opacity:0}}
.handTip{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 168px);z-index:30;font-size:15px;font-weight:bold;letter-spacing:1px;padding:5px 14px;border-radius:16px;background:rgba(10,9,8,.92);pointer-events:none;animation:tipUp 1.9s ease both}
.handTip.plus{color:var(--gold);border:1px solid var(--gold)}
.handTip.minus{color:#ff8a7a;border:1px solid #e05046}
@keyframes tipUp{0%{transform:translateY(16px) scale(.8);opacity:0}15%{transform:translateY(0) scale(1.1);opacity:1}25%{transform:scale(1)}80%{transform:translateY(-8px);opacity:1}100%{transform:translateY(-26px);opacity:0}}
#meHandN.bump{display:inline-block;animation:numBump .7s ease 2 backwards;color:var(--gold)}
@keyframes numBump{0%,100%{transform:scale(1)}40%{transform:scale(1.9)}}
.hud .it .hdelta{position:absolute;left:50%;top:100%;margin-left:-14px;width:28px;text-align:center;font-size:11px;line-height:1;font-weight:bold;color:var(--gold);animation:deltaPop 2.4s ease both;pointer-events:none}
.hud .it .hdelta.minus{color:#ff8a7a}
@keyframes deltaPop{0%{transform:translateY(8px) scale(.6);opacity:0}12%{transform:translateY(0) scale(1.4);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
#handCards .hc{position:relative}
#handCards .hc .card.fresh{border-color:var(--gold);box-shadow:0 0 12px rgba(240,216,96,.9)}
#handCards .hc .newTag{position:absolute;right:-3px;top:-6px;z-index:6;font-style:normal;font-size:11px;font-weight:bold;line-height:18px;width:18px;text-align:center;border-radius:50%;background:var(--gold);color:#231a05;box-shadow:0 1px 4px rgba(0,0,0,.6)}
#roundBanner .rb3{display:inline-block;margin-top:6px;font-size:13px;color:var(--gold-soft)}
#mulGrid .dk-cell.swapped .dk-art{animation:swapIn .7s ease;border-color:var(--gold);box-shadow:0 0 12px rgba(240,216,96,.9)}
@keyframes swapIn{0%{transform:rotateY(90deg) scale(.8);opacity:0}60%{transform:rotateY(0) scale(1.1);opacity:1}100%{transform:none}}
</style>
</head>
<body>

<!-- 开始界面 -->
<div id="startScreen">
	<div class="logo">昆特牌</div>
	<div class="sub">GWENT · 手机版 · v1.0</div>
	<div class="section-title">选择对手难度</div>
	<div id="diffList">
		<div class="diffBtn" data-diff="easy"><span class="dtag">简单</span><div class="dname">新手商人</div><div class="ddesc">AI 随机出牌，不使用天气和特殊牌策略</div></div>
		<div class="diffBtn on" data-diff="normal"><span class="dtag">普通</span><div class="dname">酒馆常客</div><div class="ddesc">AI 优先高战力牌，合理使用天气和特殊牌</div></div>
		<div class="diffBtn" data-diff="hard"><span class="dtag">困难</span><div class="dname">高阶玩家</div><div class="ddesc">AI 计算最优出牌，精确控制天气/烧灼/诱饵时机</div></div>
	</div>
	<button id="startBtn">下一步：选择牌组</button>
	<button id="helpStartBtn">玩法说明 · 新手必看</button>
</div>
<!-- 选择牌组界面 -->
<div id="deckScreen" class="hide">
	<div class="dk-head"><button id="dkBack">‹ 返回</button><div class="dk-title">选择牌组</div><span class="dk-headsp"></span></div>
	<div id="dkFactions"></div>
	<div id="dkLeaders"></div>
	<div id="dkLeader"></div>
	<div id="dkOpp"></div>
	<div id="dkStat"></div>
	<div id="dkHint">点卡牌选入牌组（可带多张的牌再点一次加一张）　·　长按看详情</div>
	<div id="dkFilters"></div>
	<div id="dkGrid"></div>
	<div class="dk-foot"><button id="dkAuto">推荐牌组</button><button id="dkClear">清空</button><button id="dkStart">开始对局</button></div>
</div>
<!-- 开局换牌界面 -->
<div id="mulligan" class="hide">
	<div class="mu-title">开局换牌</div>
	<div class="mu-sub" id="mulSub"></div>
	<div id="mulGrid"></div>
	<div class="mu-foot"><button id="mulGo">开始对局</button></div>
</div>
<!-- 结算界面 -->
<div id="endScreen"><div class="result" id="endResult">胜利</div><div class="rounds" id="endRounds">比分 2:0</div><button class="restartBtn" id="restartBtn">再来一局</button></div>
<div id="app">
	<div id="turnTag">你的回合</div>
	<div id="actionPrompt"></div>
	<div id="opbar"></div>
	<div id="fop" class="field"></div>
	<div id="weather"></div>
	<div id="fme" class="field"></div>
	<div id="mebar">
		<div id="leader"></div>
		<div id="mestats"></div>
		<div id="pass">过牌</div>
		<div id="tot"><b>0</b><span>总战力</span></div>
	</div>
	<div id="handStack"></div>
	<div id="discardPile"></div>
	<div id="helpBtn">?</div>
</div>

<div id="mask"></div>
<div id="handPanel">
	<div id="handPanelBar">
		<span class="title">手牌</span>
		<span class="count" id="handCount">0 张</span>
		<button id="handClose">收起</button>
	</div>
	<div id="handCards"></div>
	<div id="detailBar" class="empty">点击手牌查看详情</div>
</div>

<div id="discardPanel">
	<div class="dhead"><div class="dtitle" id="discardTitle">选择一张单位</div><span><button id="discardOk">确定</button> <button id="discardClose">关闭</button></span></div>
	<div id="discardCards"></div>
</div>

<div id="leaderModal">
	<div class="box">
		<div class="lport" id="leaderPort"></div>
		<div class="lname" id="leaderName"></div>
		<div class="lfac" id="leaderFac"></div>
		<div class="lskill" id="leaderSkill"></div>
		<div class="ldesc" id="leaderDesc"></div>
		<div class="lnote" id="leaderNote"></div>
		<div class="lbtns"><button id="leaderCancel">取消</button><button id="leaderUse">确认使用</button></div>
	</div>
</div>

<div id="cardModal">
	<div class="box">
		<div class="bigcard" id="modalCard"></div>
		<div class="cname" id="modalName"></div>
		<div class="cmeta" id="modalMeta"></div>
		<div class="cdesc" id="modalDesc"></div>
		<button class="cclose" id="modalClose">关闭</button>
	</div>
</div>

<div id="helpPanel">
	<div class="hp-head"><span class="hp-title">玩法说明</span><button id="helpClose">关闭</button></div>
	<div class="hp-tabs" id="helpTabs">
		<div class="ht on" data-t="rules">玩法</div><div class="ht" data-t="skills">技能图鉴</div><div class="ht" data-t="leaders">领袖</div><div class="ht" data-t="tips">小贴士</div>
	</div>
	<div class="hp-body" id="helpBody"></div>
	<div class="hp-foot"><button id="helpReplay">重看新手引导</button></div>
</div>

<div id="coach">
	<div class="spot" id="coachSpot"></div>
	<div class="tip" id="coachTip">
		<div class="tstep" id="coachStep"></div>
		<div class="tt" id="coachTitle"></div>
		<div class="tx" id="coachText"></div>
		<div class="tb"><button id="coachSkip">跳过</button><span class="tsp"></span><button id="coachPrev">上一步</button><button id="coachNext">下一步</button></div>
	</div>
</div>

<div id="roundBanner"></div>
<div id="toast"></div>

<script src="data/cards.js"></script>
<script src="data/abilities.js"></script>
<script src="js/rules.js"></script>
<script src="js/effects.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
