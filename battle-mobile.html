<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>昆特牌 · 手机版</title>
<style>
:root{
	--gold:#d4af37; --gold-soft:#b8943a; --gold-dim:#8a6d2f;
	--ink:#f0e6d2; --ink-dim:#b8a97f;
	--bg:#0b0a09; --bg2:#151311; --bg3:#1f1b17;
	--line:rgba(212,175,55,.25);
	--red:#a33; --green:#5a8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#000;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column}

/* ========== 主舞台（方案B 炉石式） ========== */
#app{position:fixed;inset:0;overflow:hidden;
	background:linear-gradient(180deg,#1b1713 0%,#0e0c0a 55%,#12100d 100%)}
#app::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 15%,rgba(120,90,40,.12),transparent 50%);pointer-events:none}

/* 对手条 */
#opbar{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;height:48px;display:flex;align-items:center;background:linear-gradient(180deg,rgba(30,26,22,.92),rgba(18,16,13,.9));border:1px solid var(--line);border-radius:12px;padding:0 10px;z-index:10}
.ava{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold-dim);background-size:150% auto;background-position:50% 6%;background-repeat:no-repeat;flex-shrink:0}
.opname{margin-left:8px;font-size:12px;color:var(--ink);line-height:1.2}
.opname small{display:block;font-size:9px;color:var(--ink-dim)}
.hud{display:flex;align-items:center;gap:10px;margin-left:auto}
.hud .it{display:flex;flex-direction:column;align-items:center;color:var(--ink-dim);font-size:8px;line-height:1.1;gap:2px}
.hud .it b{color:var(--ink);font-size:14px}
/* 对手总分徽章：与下方我方总战力 #tot 同色系（金框深底），方便一眼对比双方分数 */
.hud .it.score b{background:rgba(0,0,0,.55);border:1.5px solid var(--gold-dim);color:var(--gold);border-radius:6px;padding:1px 9px;font-size:14px;line-height:1.6}
.gems{display:flex;gap:2px}
.gem{width:11px;height:11px;border-radius:50%;background:#5a1010;border:1px solid #300}
.gem.on{background:linear-gradient(135deg,#d22,#700)}

/* 战场行 */
.field{position:absolute;left:10px;right:10px;display:flex;flex-direction:column;justify-content:space-between;z-index:5}
#fop{top:64px;height:138px}
#fme{top:286px;height:228px}
.crow{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:8px;display:flex;align-items:center;padding:0 8px;position:relative;transition:border-color .2s, box-shadow .2s}
#fop .crow{height:42px}
#fme .crow{height:72px;background:rgba(60,48,28,.16);border:1px solid rgba(212,175,55,.18)}
.crow.target{border-color:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.4);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(212,175,55,.3)}50%{box-shadow:0 0 18px rgba(212,175,55,.6)}}
.crow .lab{width:36px;font-size:9px;color:var(--ink-dim);flex-shrink:0}
.crow .cards{flex:1;display:flex;justify-content:flex-start;align-items:center;gap:4px;overflow:hidden}
#fop .crow .card{width:30px;height:40px}
#fme .crow .card{width:48px;height:66px}
.crow .rsc{width:26px;height:24px;margin-left:auto;flex-shrink:0;border-radius:6px;color:#000;font-weight:bold;font-size:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.3)}

/* 天气 */
#weather{position:absolute;top:210px;left:20%;right:20%;height:18px;display:flex;justify-content:center;gap:6px;z-index:6}
.wcard{width:44px;height:18px;border-radius:4px;background-size:cover;background-position:center;border:1px solid rgba(160,190,230,.4);box-shadow:0 0 5px rgba(150,180,220,.3)}

/* 卡牌通用 */
.card{position:relative;border-radius:5px;background-size:cover;background-position:center;box-shadow:0 1px 3px rgba(0,0,0,.6);flex-shrink:0;transition:transform .15s, box-shadow .15s;cursor:pointer}
.card:active{transform:scale(.95)}
.card .pw{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:bold;min-width:16px;text-align:center;padding:0 2px;border-radius:4px;border:1px solid rgba(255,255,255,.25);line-height:16px;z-index:4}
.card.hero .pw{color:#000;background:linear-gradient(135deg,#f0d860,#c8a030);border-color:#8a6d2f}
.card.special .pw,.card.weather .pw{display:none}

/* 行图标（战力数字下面，左侧垂直排列第二位） */
.card .row-icon{
	position:absolute;left:3px;top:24px;
	width:18px;height:18px;
	pointer-events:none;z-index:3;
}
.card .row-icon img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
/* 能力图标（行图标下面，左侧垂直排列第三位，可多个纵向堆叠） */
.card .ability-icon{
	position:absolute;left:3px;top:46px;
	display:flex;flex-direction:column;gap:3px;
	pointer-events:none;z-index:3;
}
.card .ability-icon .ai{width:16px;height:16px;}
.card .ability-icon .ai img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
/* 天气卡：天气图标直接放左上角（无战力无行图标） */
.card.weather .row-icon{top:3px;}
/* 特殊卡：能力图标直接放左上角（无战力无行图标） */
.card.special .ability-icon{top:3px;}

.card.just-played{animation:playIn .5s ease}
@keyframes playIn{0%{transform:translateY(-40px) scale(.5);opacity:0}60%{transform:translateY(4px) scale(1.08)}100%{transform:translateY(0) scale(1);opacity:1}}

/* 稀有度标识：金卡/银卡/特殊/天气（仅边框+光晕） */
.card.rarity-gold{border:2px solid #e8c84a !important;box-shadow:0 0 8px rgba(232,200,74,.55), inset 0 0 6px rgba(232,200,74,.25)}
.card.rarity-silver{border:1px solid #b8c0cc !important;box-shadow:0 0 4px rgba(180,190,210,.3)}
.card.rarity-special{border:1px solid #a060d0 !important;box-shadow:0 0 5px rgba(160,96,208,.4)}
.card.rarity-weather{border:1px solid #5a9ad0 !important;box-shadow:0 0 5px rgba(90,154,208,.4)}

/* 不同尺寸适配（垂直图标列） */
/* 对手战场卡 30x40 */
#fop .crow .card .pw{font-size:8px;min-width:11px;line-height:11px;left:2px;top:2px}
#fop .crow .card .row-icon{top:17px;left:2px;width:11px;height:11px}
#fop .crow .card .ability-icon{display:none}
#fop .crow .card.weather .row-icon{top:2px}
/* 我方战场卡 48x66 */
#fme .crow .card .pw{font-size:10px;min-width:14px;line-height:14px}
#fme .crow .card .row-icon{top:21px;width:14px;height:14px}
#fme .crow .card .ability-icon{top:39px;gap:2px}
#fme .crow .card .ability-icon .ai{width:12px;height:12px}
#fme .crow .card.weather .row-icon{top:3px}
#fme .crow .card.special .ability-icon{top:3px}
/* 底部手牌扇形卡 56x84 */
#handStack .card .pw{font-size:10px;min-width:14px;line-height:14px}
#handStack .card .row-icon{top:22px;width:14px;height:14px}
#handStack .card .ability-icon{display:none}
#handStack .card.weather .row-icon{top:3px}
/* 手牌卡 72x104 */
#handCards .card .row-icon{width:17px;height:17px;top:23px}
#handCards .card .ability-icon{top:44px}
#handCards .card.weather .row-icon{top:3px}
#handCards .card.special .ability-icon{top:3px}

/* 我方操作条 */
#mebar{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 100px);height:52px;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(30,26,22,.95),rgba(16,14,12,.95));border:1px solid var(--line);border-radius:12px;padding:0 10px;z-index:10}
#leader{width:42px;height:42px;border-radius:8px;background-size:150% auto;background-position:50% 6%;background-repeat:no-repeat;border:2px solid var(--gold-dim);flex-shrink:0;cursor:pointer;transition:transform .15s}
#leader:active{transform:scale(.92)}
#leader.ready{border-color:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.6)}
#leader.used{filter:grayscale(1) brightness(.5)}
#mestats{margin-left:4px;font-size:10px;color:var(--ink-dim);line-height:1.4;flex:1}
#mestats b{color:var(--ink);font-size:13px}
#pass{margin-left:auto;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8b14a,#7a5d16);color:#231a05;font-weight:bold;font-size:12px;border:2px solid #4a3a10;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
#pass:active{transform:scale(.92)}
#pass.passed{background:radial-gradient(circle at 35% 30%,#666,#333);color:#999;border-color:#222}
#tot{width:54px;height:46px;border-radius:8px;background:rgba(0,0,0,.55);border:2px solid var(--gold-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
#tot b{color:var(--gold);font-size:15px}
#tot span{font-size:7px;color:var(--ink-dim)}

/* 手牌扇形：铺满底部左侧空白区，卡牌互相叠放，点任意一张展开手牌面板 */
#handStack{position:absolute;left:10px;right:84px;bottom:calc(env(safe-area-inset-bottom) + 8px);height:84px;z-index:20;cursor:pointer}
#handStack .card{position:absolute;bottom:0;width:56px;height:84px;border:1px solid rgba(255,255,255,.14);transition:transform .2s}
#handStack .card:active{transform:translateY(-6px)}
#handStack .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-dim);letter-spacing:1px;border:1px dashed rgba(255,255,255,.12);border-radius:8px}

/* 弃牌堆：底部最右 */
#discardPile{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 8px);width:60px;height:84px;z-index:20;border-radius:6px;border:1px dashed rgba(212,175,55,.45);background:rgba(0,0,0,.3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden}
#discardPile.has{border:1px solid var(--gold-dim)}
#discardPile .dp-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.6))}
#discardPile .dp-label{position:relative;font-size:10px;color:var(--ink);letter-spacing:1px;text-shadow:0 1px 2px #000}
#discardPile .dp-count{position:relative;font-size:22px;font-weight:bold;color:var(--gold);text-shadow:0 1px 3px #000;line-height:1.2}

/* ========== 手牌展开面板 ========== */
#handPanel{position:fixed;left:0;right:0;bottom:0;z-index:100;background:linear-gradient(180deg,rgba(10,9,8,.92),rgba(16,14,12,.98));border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
#handPanel.open{transform:translateY(0)}
#handPanelBar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
#handPanelBar .title{font-size:13px;color:var(--gold);letter-spacing:2px}
#handPanelBar .count{font-size:11px;color:var(--ink-dim)}
#handClose{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);font-size:11px;padding:4px 12px;border-radius:12px;cursor:pointer}
#handCards{display:flex;gap:8px;padding:14px 26px 8px 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;min-height:168px;align-items:flex-end;scroll-snap-type:x proximity}
#handCards::-webkit-scrollbar{display:none}
#handCards .hc{flex-shrink:0;width:72px;display:flex;flex-direction:column;align-items:stretch;cursor:pointer;scroll-snap-align:start;transition:transform .15s}
#handCards .hc.selected{transform:translateY(-10px)}
#handCards .card{width:72px;height:104px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
#handCards .hc.selected .card{box-shadow:0 0 16px rgba(212,175,55,.7);border-color:var(--gold)}
/* 卡牌名称（大）+ 技能名称（小） */
.cap{margin-top:4px;text-align:center;width:100%}
.cap .cn{font-size:13px;font-weight:bold;color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .cn.long{font-size:11px}
.cap .ca{font-size:9.5px;color:var(--gold-soft);line-height:1.25;min-height:12px;max-height:24px;overflow:hidden}
#handCards .hc.selected .cap .cn{color:var(--gold)}
/* 缺图占位卡面：阵营渐变底 + 首字 + 名称 */
.noart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:rgba(255,255,255,.88);text-shadow:0 1px 3px #000;z-index:1;overflow:hidden}
.noart i{font-style:normal;font-weight:bold;font-size:26px;opacity:.45;line-height:1}
.noart span{font-size:9px;margin-top:3px;text-align:center;padding:0 2px;line-height:1.15}
#fop .noart i{font-size:15px}
#fop .noart span{display:none}
#fme .noart i{font-size:22px}
#fme .noart span{font-size:8px}
#handStack .noart i{font-size:24px}
#handStack .noart span{display:none}
#handCards .noart i{font-size:34px}
#handCards .noart span{font-size:11px}
#detailBar .noart i{font-size:30px}
#detailBar .noart span{display:none}
#cardModal .noart i{font-size:90px}
#cardModal .noart span{font-size:20px;margin-top:8px}
#handCards .card .pw{font-size:11px;min-width:16px;line-height:16px}

/* 详情条 */
#detailBar{padding:8px 14px 12px;border-top:1px solid rgba(255,255,255,.06);min-height:64px;display:flex;align-items:center;gap:10px}
#detailBar .thumb{width:56px;height:80px;border-radius:6px;background-size:cover;background-position:center;flex-shrink:0;position:relative;overflow:hidden;border:2px solid var(--gold-dim);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#detailBar .thumb.gold{border-color:#e8c84a;box-shadow:0 0 10px rgba(232,200,74,.5)}
#detailBar .thumb.silver{border-color:#b8c0cc}
#detailBar .thumb.special{border-color:#a060d0;box-shadow:0 0 8px rgba(160,96,208,.4)}
#detailBar .thumb.weather{border-color:#5a9ad0;box-shadow:0 0 8px rgba(90,154,208,.4)}
#detailBar .thumb .tpw{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#f0d860,#a8821a);color:#2a1a05;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:1px solid #4a3a10;box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:3}
#detailBar .thumb .tname{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));color:#fff;font-size:9px;text-align:center;padding:10px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;z-index:2}
#detailBar .thumb .row-icon{position:absolute;left:3px;top:26px;width:20px;height:20px;z-index:3}
#detailBar .thumb .row-icon img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#detailBar .thumb .ability-icon{position:absolute;left:3px;top:50px;display:flex;flex-direction:column;gap:3px;z-index:3}
#detailBar .thumb .ability-icon .ai{width:18px;height:18px}
#detailBar .thumb .ability-icon .ai img{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
#detailBar .thumb.weather .row-icon{top:3px}
#detailBar .thumb.special .ability-icon{top:3px}
#detailBar .info{flex:1;min-width:0}
#detailBar .info .n{font-size:13px;color:var(--ink);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detailBar .info .meta{font-size:10px;color:var(--ink-dim);margin-top:2px}
#detailBar .info .desc{font-size:10px;color:var(--gold-soft);margin-top:3px;line-height:1.4}
#detailBar .playBtn{background:radial-gradient(circle at 35% 30%,#e0b950,#7a5d16);color:#231a05;font-weight:bold;font-size:18px;letter-spacing:3px;border:2px solid #4a3a10;border-radius:28px;min-width:104px;min-height:52px;padding:12px 26px;cursor:pointer;flex-shrink:0;transition:transform .15s;box-shadow:0 3px 12px rgba(0,0,0,.5)}
#detailBar .playBtn:active{transform:scale(.92)}
#detailBar.empty{justify-content:center;color:#555;font-size:11px}

/* 遮罩 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
#mask.show{opacity:1;pointer-events:auto}

/* ========== 卡牌详情浮层 ========== */
#cardModal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
#cardModal.show{opacity:1;pointer-events:auto}
#cardModal .box{background:linear-gradient(180deg,#1a1612,#0e0c0a);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:300px;width:80%;text-align:center;transform:scale(.9);transition:transform .25s}
#cardModal.show .box{transform:scale(1)}
#cardModal .bigcard{width:180px;height:260px;margin:0 auto 12px;border-radius:8px;background-size:cover;background-position:center;border:2px solid var(--gold-dim);box-shadow:0 4px 20px rgba(0,0,0,.6)}
#cardModal .cname{font-size:16px;color:var(--ink);font-weight:bold;margin-bottom:6px}
#cardModal .cmeta{font-size:11px;color:var(--ink-dim);margin-bottom:8px}
#cardModal .cmeta span{margin:0 4px}
#cardModal .cdesc{font-size:12px;color:var(--gold-soft);line-height:1.6;margin-bottom:12px}
#cardModal .cclose{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);font-size:12px;padding:6px 24px;border-radius:14px;cursor:pointer}

/* Toast */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.85);color:var(--ink);font-size:14px;padding:12px 24px;border-radius:10px;border:1px solid var(--line);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 回合指示 */
#turnTag{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--gold);color:#231a05;font-size:10px;font-weight:bold;padding:2px 10px;border-radius:8px;z-index:11;letter-spacing:1px}

/* ========== 开始界面 ========== */
#startScreen{position:fixed;inset:0;z-index:500;background:radial-gradient(ellipse at 50% 30%,#2a2318 0%,#12100d 60%,#080706 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:opacity .4s}
#startScreen.hide{opacity:0;pointer-events:none}
#startScreen .logo{font-size:42px;font-weight:bold;color:var(--gold);letter-spacing:8px;text-shadow:0 0 20px rgba(212,175,55,.4);margin-bottom:4px}
#startScreen .sub{font-size:13px;color:var(--ink-dim);letter-spacing:4px;margin-bottom:40px}
#startScreen .section-title{font-size:14px;color:var(--ink);margin-bottom:14px;letter-spacing:2px}
#diffList{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin-bottom:30px}
.diffBtn{background:rgba(20,18,15,.8);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s;text-align:left}
.diffBtn:active{transform:scale(.98)}
.diffBtn.on{border-color:var(--gold);background:rgba(212,175,55,.1);box-shadow:0 0 12px rgba(212,175,55,.2)}
.diffBtn .dname{font-size:15px;font-weight:bold;color:var(--ink);margin-bottom:3px}
.diffBtn.on .dname{color:var(--gold)}
.diffBtn .ddesc{font-size:11px;color:var(--ink-dim);line-height:1.4}
.diffBtn .dtag{float:right;font-size:10px;padding:2px 8px;border-radius:8px;margin-top:2px}
.diffBtn[data-diff="easy"] .dtag{background:#3a6b3a;color:#8f8}
.diffBtn[data-diff="normal"] .dtag{background:#6b5a3a;color:#fd8}
.diffBtn[data-diff="hard"] .dtag{background:#6b3a3a;color:#f88}

<script>
// ========== 技能描述映射（与下方引擎实际实现保持一致，不再写"演示中"话术） ==========
var ABILITY = {
	"hero":"猛将：不受天气、烧灼、战鼓影响",
	"bond":"同袍呼应：同排同名单位数量越多，每张战力都按数量倍增",
	"medic":"归阵：打出后可从弃牌堆选择一张单位牌立即上场",
	"spy":"卧底：打出后放置到对方半场，己方额外抽2张牌",
	"horn":"战鼓：选择己方一整排，本排非猛将单位战力翻倍（持续本回合）",
	"scorch":"烧灼：摧毁双方场上战力并列最高的非猛将单位",
	"frost":"寒潮：双方近战普通单位战力变为1",
	"fog":"大雾：双方远程普通单位战力变为1",
	"rain":"暴雨：双方攻城普通单位战力变为1",
	"skellestorm":"海上狂风：双方远程+攻城普通单位战力变为1",
	"clear":"放晴：移除场上所有天气效果",
	"decoy":"招降：将己方场上一张非猛将单位收回手牌",
	"muster":"死士/聚将：打出后自动从手牌和牌堆中找出所有同名牌一起上场",
	"morale":"士气大振：同排其他单位战力+1",
	"mardroeme":"蛮巫祭礼：选择己方一排，该排的死士单位变身，战力翻倍",
	"purify":"净化：打出后清除所在排的天气效果",
	"agile":"伏击/灵活：打出时可以选择放进近战排或远程排",
	"leader":"领袖技",
	"":"无特殊能力"
};
var ROW_ZH = {close:"近战",ranged:"远程",siege:"攻城",agile:"敏捷","":"特殊"};
var DECK_ZH = {shuhan:"蜀汉",caowei:"曹魏",dongwu:"东吴",huangjin:"黄巾",qunxiong:"群雄",hanting:"汉廷中立",leader:"领袖",special:"特殊",weather:"天气"};

function zhName(card){ return card.name; }
function abilityDesc(card){
	var parts = [];
	if(card.ability){ card.ability.split(' ').forEach(function(k){ parts.push(ABILITY[k]||k); }); }
	if(card.row==='agile' && (!card.ability || card.ability.indexOf('agile')<0)) parts.push(ABILITY.agile);
	return parts.length ? parts.join('；') : "无特殊能力";
}
// 游戏内用 288x384 小图，点开详情用 576x768 中图（原图 1152x1536 PNG 约 450KB/张，手机上会加载很慢，仍保留在 img/sanguo/ 作为素材源）
function imgSm(card){ return "img/sanguo-sm/"+card.filename+".webp"; }
function imgLg(card){ return "img/sanguo-md/"+card.filename+".webp"; }

// 目前还没有卡图的卡牌（31 张）：用阵营色渐变 + 首字 + 名称做占位卡面。补图后从这里删掉对应名字，并把图放进 img/sanguo/ 后重新生成 sm/md 小图。
var NO_ART = {};
"袁术,公孙瓒,卢植,蔡邕,关羽,魏延,华雄,董卓,李儒,蜀汉重步,曹魏探马,于禁,黄巾水卒,南蛮酋长,臧霸,曹性,蜀地幕僚,蜀汉盾兵,黄巾斥侯,黄巾蛮夫,南蛮部族兵,西凉铁骑,洛阳流民,长安民兵,羽林弓手,缇骑,郝萌,侯选,成廉,魏续,宋宪".split(',').forEach(function(n){ NO_ART[n]=1; });
var FACTION_BG = {
	shuhan:['#1f4a2c','#0d2214'], caowei:['#1d3a63','#0b182b'], dongwu:['#6b2420','#2a0e0c'],
	huangjin:['#7a6314','#2e2606'], qunxiong:['#5a3a1c','#22150a'], hanting:['#4d2a63','#1e0f28'],
	leader:['#5a4a1c','#221c0a'], special:['#3a2a55','#150f22'], weather:['#1f4a63','#0b1f2b']
};
function artStyle(card, size){
	var bg = FACTION_BG[card.deck] || FACTION_BG.hanting;
	var grad = 'linear-gradient(160deg,'+bg[0]+','+bg[1]+')';
	if(NO_ART[card.filename]) return 'background-image:'+grad;
	// 图片加载中/失败时露出渐变底色，而不是一块空白
	return "background-image:url('"+(size==='md'?imgLg(card):imgSm(card))+"'),"+grad;
}
function artName(card){
	return NO_ART[card.filename] ? '<div class="noart"><i>'+card.name.charAt(0)+'</i><span>'+card.name+'</span></div>' : '';
}
var ABILITY_NAME = {hero:'猛将',bond:'同袍呼应',medic:'归阵',spy:'卧底',horn:'战鼓',scorch:'烧灼',frost:'寒潮',fog:'大雾',rain:'暴雨',skellestorm:'海上狂风',clear:'放晴',decoy:'招降',muster:'死士',morale:'士气大振',mardroeme:'蛮巫祭礼',purify:'净化',agile:'伏击'};
function abilityNames(card){
	var out = [];
	if(card.ability){ card.ability.split(' ').forEach(function(k){ if(ABILITY_NAME[k]) out.push(ABILITY_NAME[k]); }); }
	if(card.row==='agile') out.push('灵活');
	return out;
}
function capHTML(card){
	var ab = abilityNames(card);
	return '<div class="cap"><div class="cn'+(card.name.length>5?' long':'')+'">'+card.name+'</div><div class="ca">'+(ab.length?ab.join('·'):'')+'</div></div>';
}
function isUnit(card){ return !!card.row && card.deck!=='weather' && card.deck!=='special'; }
function isHero(card){ return card.ability && card.ability.indexOf('hero')>=0; }
function rarityClass(card){
	if(card.deck==='weather') return 'rarity-weather';
	if(card.deck==='special') return 'rarity-special';
	if(card.rarity==='gold' || isHero(card)) return 'rarity-gold';
	if(card.rarity==='bronze') return 'rarity-bronze';
	return 'rarity-silver';
}
function rarityKey(card){
	if(card.deck==='weather') return 'weather';
	if(card.deck==='special') return 'special';
	if(card.rarity==='gold' || isHero(card)) return 'gold';
	if(card.rarity==='bronze') return 'bronze';
	return 'silver';
}

// ========== 原版图标（巫师3解包 img/icons/） ==========
var ROW_ICON = {close:'card_row_close', ranged:'card_row_ranged', siege:'card_row_siege', agile:'card_row_agile'};
var ABILITY_ICON = {
	spy:'card_ability_spy', medic:'card_ability_medic', horn:'card_ability_horn',
	scorch:'card_ability_scorch', bond:'card_ability_bond', morale:'card_ability_morale',
	muster:'card_ability_muster', decoy:'card_ability_decoy', avenger:'card_ability_avenger',
	berserker:'card_ability_berserker', mardroeme:'card_ability_mardroeme'
};
var WEATHER_ICON = {frost:'card_ability_frost', fog:'card_ability_fog', rain:'card_ability_rain', clear:'card_ability_clear', storm:'card_ability_storm', skellestorm:'card_ability_storm'};

function rowIconHTML(row){
	var f = ROW_ICON[row];
	return f ? '<div class="row-icon"><img src="img/icons/'+f+'.png" alt=""></div>' : '';
}
function abilityIconHTML(ability){
	if(!ability) return '';
	var icons = [];
	for(var key in ABILITY_ICON){
		if(ability.indexOf(key)>=0) icons.push(ABILITY_ICON[key]);
	}
	if(icons.length===0) return '';
	return '<div class="ability-icon">'+icons.map(function(f){return '<div class="ai"><img src="img/icons/'+f+'.png" alt=""></div>'}).join('')+'</div>';
}
function weatherIconHTML(card){
	var f = WEATHER_ICON[card.ability];
	return f ? '<div class="row-icon"><img src="img/icons/'+f+'.png" alt=""></div>' : '';
}

// ========== 游戏状态 ==========
var S = {
	hand: [],
	meField: {close:[],ranged:[],siege:[]},
	aiField: {close:[],ranged:[],siege:[]},
	weatherRows: {close:null,ranged:null,siege:null},
	meHorn: {close:false,ranged:false,siege:false},
	aiHorn: {close:false,ranged:false,siege:false},
	meDiscard: [],
	aiDiscard: [],
	pending: null,
	selected: null,
	leader: null,
	leaderUsed: false,
	turn: 'me'
};

// 卡牌数据：254条里有73组同名（银/铜两个版本），按 name 查找只能命中第一条，
// 所以牌组构建、卧底/归阵/领袖复活等一律按 id 操作；findCard(name) 仅用于展示层的单次定点查找（如领袖名固定唯一）。
function findCard(name){ return sanguo_card_dict.find(function(x){return x.name===name}); }
function findCardById(id){ return sanguo_card_dict.find(function(x){return x.id===id}); }

// ========== 渲染 ==========
function fieldUnits(field){ return field.close.concat(field.ranged, field.siege); }
function rowKeyOf(field, card){
	var keys=['close','ranged','siege'];
	for(var i=0;i<keys.length;i++){ if(field[keys[i]].indexOf(card)>=0) return keys[i]; }
	return null;
}

// 领袖技能带来的"整排光环"挂在 field 对象上（field.aura），每回合 field 重建时自动清空：
//   all=己方全体 +N，hanting=汉廷单位 +N，cavalry=轻骑 +N；field.bonus=本回合额外获得的点数（守成）
var CAVALRY_RE = /轻骑|骑兵|游骑|探骑|缇骑/;
function auraBonus(card, field){
	var a = field.aura; if(!a) return 0;
	return (a.all||0) + (card.deck==='hanting' ? (a.hanting||0) : 0) + (CAVALRY_RE.test(card.name) ? (a.cavalry||0) : 0);
}
// 单卡在当前战场/天气/战鼓状态下的实际战力。
// 顺序：基础战力+个体修正(_mod，袁绍/皇甫嵩等) → 天气置1(猛将免疫) → 同袍呼应倍增 → 士气大振+1 → 光环 → 战鼓×2(猛将免疫)
function baseEffectivePower(card, row, field, weatherRows, hornFlags){
	if(!isUnit(card)) return 0;
	var hero = isHero(card);
	var p = Math.max(0, (parseInt(card.strength)||0) + (card._mod||0));
	if(!hero && weatherRows[row]) p = 1;
	if(card.ability && card.ability.indexOf('bond')>=0){
		var n = field[row].filter(function(c){ return c.name===card.name && c.ability && c.ability.indexOf('bond')>=0; }).length;
		if(n>1) p = p*n;
	}
	var moraleBonus = field[row].filter(function(c){ return c!==card && c.ability && c.ability.indexOf('morale')>=0; }).length;
	p += moraleBonus;
	p += auraBonus(card, field);
	if(!hero && hornFlags[row]) p = p*2;
	return p;
}
function computeSidePower(field, weatherRows, hornFlags){
	var out = {close:0, ranged:0, siege:0, total:0};
	['close','ranged','siege'].forEach(function(row){
		var sum = 0;
		field[row].forEach(function(card){ sum += baseEffectivePower(card, row, field, weatherRows, hornFlags); });
		out[row]=sum; out.total+=sum;
	});
	out.bonus = field.bonus||0;
	out.total += out.bonus;
	return out;
}

function renderOpBar(){
	var op = S.aiLeader || findCard("曹操");
	var gemsHtml = '';
	for(var gi=0;gi<2;gi++){ gemsHtml += '<div class="gem'+(gi<S.aiGems?' on':'')+'"></div>'; }
	var total = computeSidePower(S.aiField, S.weatherRows, S.aiHorn).total;
	var html = '<div class="ava" style="'+artStyle(op,'sm')+'"></div>'
		+'<div class="opname">'+op.name+'<small>'+factionName(S.aiFaction)+'</small></div>'
		+'<div class="hud">'
		+'<div class="it score"><b>'+total+'</b>总战力</div>'
		+'<div class="it"><b>'+S.aiHand.length+'</b>手牌</div>'
		+'<div class="it"><b>第'+S.round+'局</b></div>'
		+'<div class="gems">'+gemsHtml+'</div>'
		+'</div>';
	document.getElementById('opbar').innerHTML = html;
}

function renderField(containerId, field, isMe){
	var c = document.getElementById(containerId);
	var hornFlags = isMe ? S.meHorn : S.aiHorn;
	var rows = isMe ? ['close','ranged','siege'] : ['siege','ranged','close'];
	var html = '';
	rows.forEach(function(r){
		var rowPickable = isMe && S.pending && (S.pending.kind==='horn' || S.pending.kind==='mardroeme' || (S.pending.kind==='agile' && (r==='close'||r==='ranged')));
		html += '<div class="crow'+(rowPickable?' pickable':'')+'" data-row="'+r+'"><div class="lab">'+ROW_ZH[r]+'</div><div class="cards">';
		field[r].forEach(function(card){
			var pw = baseEffectivePower(card, r, field, S.weatherRows, hornFlags);
			var cardPickable = S.pending && !isHero(card) && ((isMe && S.pending.kind==='decoy') || (!isMe && S.pending.kind==='charm'));
			var cls = 'card '+(cardPickable?'pickable ':'')+(isHero(card)?'hero ':'')+rarityClass(card)+(card._just?' just-played':'');
			var icons = rowIconHTML(card.row) + abilityIconHTML(card.ability);
			html += '<div class="'+cls+'" data-name="'+card.name+'" style="'+artStyle(card,'sm')+'">'
				+artName(card)
				+'<div class="pw">'+pw+'</div>'
				+icons+'</div>';
		});
		var rowTotal = field[r].reduce(function(s,c){ return s + baseEffectivePower(c, r, field, S.weatherRows, hornFlags); }, 0);
		html += '</div><div class="rsc">'+rowTotal+'</div></div>';
	});
	c.innerHTML = html;
	// 清除 just-played 标记
	['close','ranged','siege'].forEach(function(r){ field[r].forEach(function(card){ delete card._just; }); });
}

function renderWeather(){
	var c = document.getElementById('weather');
	var cards = [], seen = {};
	['close','ranged','siege'].forEach(function(row){
		var w = S.weatherRows[row];
		if(w && !seen[w.id]){ seen[w.id]=true; cards.push(w); }
	});
	c.innerHTML = cards.map(function(w){
		return '<div class="wcard" data-id="'+w.id+'" style="'+artStyle(w,'sm')+'" title="'+zhName(w)+'"></div>';
	}).join('');
}

function renderMeBar(){
	var lead = document.getElementById('leader');
	lead.setAttribute('style', artStyle(S.leader,'sm'));
	lead.className = S.leaderUsed ? 'used' : (leaderCanUse('me') ? 'ready' : '');
	document.getElementById('mestats').innerHTML = zhName(S.leader)+' · '+factionName(S.faction)+'<br>牌库 <b>'+MY_DECK_POOL.length+'</b> &nbsp; 手牌 <b>'+S.hand.length+'</b>';
	document.getElementById('tot').innerHTML = '<b>'+computeSidePower(S.meField, S.weatherRows, S.meHorn).total+'</b><span>总战力</span>';
	var pass = document.getElementById('pass');
	pass.textContent = S.mePassed?'已过':'过牌';
	pass.className = S.mePassed?'passed':'';
}

function handCls(card){
	return 'card '+(isHero(card)?'hero ':'')+(card.deck==='special'?'special ':'')+(card.deck==='weather'?'weather ':'')+rarityClass(card);
}
function cardIcons(card){
	return card.deck==='weather' ? weatherIconHTML(card) : rowIconHTML(card.row) + abilityIconHTML(card.ability);
}

// 手牌扇形：铺满底部左侧空白区，卡多时自动压缩间距，保证全部手牌都能看到
function renderHandStack(){
	var c = document.getElementById('handStack');
	var n = S.hand.length;
	if(!n){ c.innerHTML = '<div class="none">暂无手牌</div>'; return; }
	var W = c.clientWidth || 280, cw = 56;
	var step = n>1 ? Math.min(cw+4, (W-cw)/(n-1)) : 0;
	var html = '';
	S.hand.forEach(function(card, i){
		html += '<div class="'+handCls(card)+'" data-idx="'+i+'" style="left:'+Math.round(i*step)+'px;'+artStyle(card,'sm')+'">'
			+artName(card)
			+(card.strength?'<div class="pw">'+card.strength+'</div>':'')
			+cardIcons(card)+'</div>';
	});
	c.innerHTML = html;
}

// 弃牌堆：底部最右，显示最上面一张和数量
function renderDiscardPile(){
	var el = document.getElementById('discardPile');
	var n = S.meDiscard.length;
	if(!n){
		el.className = ''; el.removeAttribute('style');
		el.innerHTML = '<span class="dp-label">弃牌堆</span><span class="dp-count">0</span>';
		return;
	}
	var top = S.meDiscard[n-1];
	el.className = 'has'; el.setAttribute('style', artStyle(top,'sm'));
	el.innerHTML = artName(top)+'<div class="dp-shade"></div><span class="dp-label">弃牌堆</span><span class="dp-count">'+n+'</span>';
}

function renderHandPanel(){
	document.getElementById('handCount').textContent = S.hand.length + ' 张';
	var c = document.getElementById('handCards');
	var html = '';
	S.hand.forEach(function(card, i){
		var sel = S.selected===i?' selected':'';
		html += '<div class="hc'+sel+'" data-idx="'+i+'">'
			+'<div class="'+handCls(card)+'" style="'+artStyle(card,'sm')+'">'
			+artName(card)
			+(card.strength?'<div class="pw">'+card.strength+'</div>':'')
			+cardIcons(card)+'</div>'
			+capHTML(card)+'</div>';
	});
	c.innerHTML = html;
	renderDetailBar();
}

function renderDetailBar(){
	var bar = document.getElementById('detailBar');
	if(S.selected===null || !S.hand[S.selected]){
		bar.className = 'empty'; bar.textContent = '点击手牌查看详情'; return;
	}
	var card = S.hand[S.selected];
	bar.className = '';
	var meta = (card.strength?('战力 '+card.strength+' · '):'') + ROW_ZH[card.row] + ' · ' + DECK_ZH[card.deck];
	var rk = rarityKey(card);
	var thumbIcons = rowIconHTML(card.row) + abilityIconHTML(card.ability);
	if(card.deck==='weather') thumbIcons = weatherIconHTML(card);
	bar.innerHTML = '<div class="thumb '+rk+'" style="'+artStyle(card,'sm')+'">'
		+artName(card)
		+(card.strength?'<div class="tpw">'+card.strength+'</div>':'')
		+thumbIcons
		+'<div class="tname">'+zhName(card)+'</div></div>'
		+'<div class="info"><div class="n">'+zhName(card)+'</div>'
		+'<div class="meta">'+meta+'</div>'
		+'<div class="desc">'+abilityDesc(card)+'</div></div>'
		+'<button class="playBtn" id="playBtn">出牌</button>';
}

function render(){
	renderOpBar();
	renderField('fop', S.aiField, false);
	renderField('fme', S.meField, true);
	renderWeather();
	renderMeBar();
	renderHandStack();
	renderDiscardPile();
	if(document.getElementById('handPanel').classList.contains('open')) renderHandPanel();
}

// ========== 交互 ==========
var panel = document.getElementById('handPanel');
var mask = document.getElementById('mask');

function openPanel(idx){
	panel.classList.add('open'); mask.classList.add('show');
	S.selected = (typeof idx==='number' && S.hand[idx]) ? idx : null;
	renderHandPanel();
	var sel = document.querySelector('#handCards .hc.selected');
	if(sel) document.getElementById('handCards').scrollLeft = Math.max(0, sel.offsetLeft - 24);
}
function closePanel(){
	panel.classList.remove('open'); mask.classList.remove('show');
	S.selected = null;
}

// 点底部扇形里的任意一张手牌：展开手牌面板并直接选中那张
document.getElementById('handStack').addEventListener('click', function(e){
	if(S.pending && S.pending.kind!=='handdiscard'){ toast('请先完成当前操作'); return; }
	var el = e.target.closest('.card');
	openPanel(el ? parseInt(el.dataset.idx) : undefined);
});
document.getElementById('handClose').addEventListener('click', closePanel);
mask.addEventListener('click', function(){
	if(S.pending && S.pending.kind==='medic') return; // 归阵/领袖复活必须选一张，不允许点遮罩关闭
	closeDiscardPanel(); closePanel();
});

// 手牌点击
document.getElementById('handCards').addEventListener('click', function(e){
	var item = e.target.closest('.hc');
	if(S.pending){
		// 孙权·制衡江东：点哪张就弃哪张
		if(S.pending.kind==='handdiscard' && item){ resolveHandDiscard(parseInt(item.dataset.idx)); return; }
		toast('请先完成当前操作'); return;
	}
	if(!item) return;
	var idx = parseInt(item.dataset.idx);
	if(S.selected === idx){
		// 再次点击 = 出牌
		playCard(idx);
	} else {
		S.selected = idx;
		document.querySelectorAll('#handCards .hc').forEach(function(el){el.classList.remove('selected')});
		item.classList.add('selected');
		renderDetailBar();
	}
});

// 详情条出牌按钮
document.getElementById('detailBar').addEventListener('click', function(e){
	if(S.pending){ toast('请先完成当前操作'); return; }
	if(e.target.id==='playBtn' && S.selected!==null) playCard(S.selected);
});

// ========== 出牌与技能结算 ==========
function showPrompt(text){
	var el = document.getElementById('actionPrompt');
	el.textContent = text; el.classList.add('show');
}
function hidePrompt(){ document.getElementById('actionPrompt').classList.remove('show'); }

function playCard(idx){
	if(S.pending){ toast('请先完成当前操作'); return; }
	var card = S.hand[idx];
	if(!card) return;
	if(S.mePassed || S.gameOver || S.turn!=='me'){ return; }
	S.last.me = card;

	if(isUnit(card)){
		if(card.row==='agile'){
			S.hand.splice(idx,1);
			closePanel();
			startAgilePick(card);
			return;
		}
		S.hand.splice(idx,1);
		placeUnitCard(card, card.row, 'me');
		return;
	}
	if(card.deck==='weather'){
		S.hand.splice(idx,1);
		applyWeatherCard(card, 'me');
		toast(card.ability==='clear' ? '放晴：移除所有天气' : '天气：'+zhName(card));
		closePanel(); render(); afterAction();
		return;
	}
	if(card.deck==='special'){
		S.hand.splice(idx,1);
		toDiscard('me', card);
		closePanel();
		if(card.ability==='horn'){ startHornPick(); return; }
		if(card.ability==='decoy'){ startDecoyPick(); return; }
		if(card.ability==='mardroeme'){ startMardroemePick(); return; }
		if(card.ability==='scorch'){
			var v = resolveScorch();
			toast(v.length? '烧灼：摧毁了 '+v.map(zhName).join('、') : '烧灼：场上没有可摧毁的目标');
			render(); afterAction();
			return;
		}
		toast(zhName(card)+'：本局卡池没有可触发的目标');
		render(); afterAction();
		return;
	}
}

// 打出一张单位卡到指定行（含卧底转移到对方半场、死士连锁、归阵后续选择）
function placeUnitCard(card, row, side){
	card._just = true;
	// 净化：打出后清除所在排的天气（在对方半场的卧底牌不触发）
	if(card.ability && card.ability.indexOf('purify')>=0 && S.weatherRows[row]){
		S.weatherRows[row] = null;
		toast((side==='me'?'':'对手')+'净化：'+ROW_ZH[row]+'排的天气被清除');
	}
	var hasSpy = card.ability && card.ability.indexOf('spy')>=0;
	var myField = side==='me'?S.meField:S.aiField;
	var oppField = side==='me'?S.aiField:S.meField;
	var field = hasSpy ? oppField : myField;
	field[row].push(card);
	var extraMsg = '';
	if(card.ability && card.ability.indexOf('muster')>=0){
		var extra = resolveMuster(card, side);
		if(extra.length) extraMsg = '，死士！额外打出 '+extra.length+' 张同名牌';
	}
	if(side==='me'){
		if(hasSpy){ drawCards(2); toast('卧底：'+zhName(card)+' 潜入对方半场'+extraMsg+'，你抽了2张牌'); }
		else toast('打出：'+zhName(card)+extraMsg);
		closePanel();
		render();
		if(card.ability && card.ability.indexOf('medic')>=0){ startMedicPick(false); }
		else { afterAction(); }
	} else {
		if(hasSpy){ aiDraw(2); toast('对手打出卧底：'+zhName(card)+'，潜入你方半场'+extraMsg); }
		else toast('对手打出：'+zhName(card)+extraMsg);
		render();
		if(card.ability && card.ability.indexOf('medic')>=0){ aiResolveMedic(); }
		afterAction();
	}
}

// 弃牌堆记账：打出的特殊牌、被烧灼的单位、回合结束时场上的牌和天气牌都会进弃牌堆
function toDiscard(side, card){
	if(card._copy) return; // 幻术复制出来的牌不进弃牌堆
	(side==='me'?S.meDiscard:S.aiDiscard).push(card);
}
function flushWeatherToDiscard(){
	S.weatherLog.forEach(function(e){ toDiscard(e.side, e.card); });
	S.weatherLog = [];
}
function applyWeatherCard(card, side){
	if(card.ability==='clear'){
		flushWeatherToDiscard();
		toDiscard(side, card);
		S.weatherRows = {close:null,ranged:null,siege:null};
		return;
	}
	// 同类天气被新的覆盖时，旧的那张进弃牌堆
	S.weatherLog = S.weatherLog.filter(function(e){
		if(e.card.ability===card.ability){ toDiscard(e.side, e.card); return false; }
		return true;
	});
	S.weatherLog.push({card:card, side:side});
	if(card.ability==='frost'){ S.weatherRows.close=card; }
	else if(card.ability==='fog'){ S.weatherRows.ranged=card; }
	else if(card.ability==='rain'){ S.weatherRows.siege=card; }
	else if(card.ability==='skellestorm'){ S.weatherRows.ranged=card; S.weatherRows.siege=card; }
}

// 死士/聚将：从手牌+己方牌堆找出所有同名牌一并打出
function resolveMuster(card, side){
	var hand = side==='me'?S.hand:S.aiHand;
	var pool = side==='me'?MY_DECK_POOL:AI_DECK_POOL;
	var field = side==='me'?S.meField:S.aiField;
	var extra = [];
	for(var i=hand.length-1;i>=0;i--){ if(hand[i]!==card && hand[i].name===card.name){ extra.push(hand.splice(i,1)[0]); } }
	for(var j=pool.length-1;j>=0;j--){ if(pool[j].name===card.name){ extra.push(pool.splice(j,1)[0]); } }
	extra.forEach(function(c){ c._just=true; field[c.row==='agile'?'close':c.row].push(c); });
	return extra;
}

// 烧灼：摧毁双方场上并列最高战力的非猛将单位
function resolveScorch(){
	var all = [];
	['close','ranged','siege'].forEach(function(row){
		S.meField[row].forEach(function(c){ if(!isHero(c)) all.push({side:'me',row:row,card:c,p:baseEffectivePower(c,row,S.meField,S.weatherRows,S.meHorn)}); });
		S.aiField[row].forEach(function(c){ if(!isHero(c)) all.push({side:'ai',row:row,card:c,p:baseEffectivePower(c,row,S.aiField,S.weatherRows,S.aiHorn)}); });
	});
	if(!all.length) return [];
	var maxP = Math.max.apply(null, all.map(function(x){return x.p;}));
	if(maxP<=0) return [];
	var victims = all.filter(function(x){return x.p===maxP;});
	victims.forEach(function(v){
		var field = v.side==='me'?S.meField:S.aiField;
		var i = field[v.row].indexOf(v.card);
		if(i>=0){ field[v.row].splice(i,1); delete v.card._mod; toDiscard(v.side, v.card); }
	});
	return victims.map(function(v){return v.card;});
}

// 孙权·制衡江东：弃置选中的1张手牌，抽2张
function resolveHandDiscard(idx){
	var card = S.hand[idx]; if(!card) return;
	S.hand.splice(idx,1); toDiscard('me', card);

// 貂蝉·离间：点对手场上一张非猛将单位，让它转投我方
function resolveCharmPick(name, row){
	var list = S.aiField[row]; if(!list) return;
	var card = list.find(function(c){ return c.name===name && !isHero(c); });
	if(!card){ toast('不能魅惑猛将'); return; }

	putOnField(S.meField, card, row);

	toast('离间：'+zhName(card)+' 转投你方');

// 蛮巫祭礼：选己方一排，本排的"死士"单位变身，战力翻倍
function startMardroemePick(){
	S.pending = {kind:'mardroeme'};
	showPrompt('蛮巫祭礼：选择己方一排，该排的死士单位变身（战力翻倍）');
	render();
}
function resolveMardroeme(side, row){
	var T = SD(side), hit = T.field[row].filter(function(c){ return isMusterUnit(c) && !isHero(c); });
	hit.forEach(function(c){ c._mod = (c._mod||0) + (parseInt(c.strength)||0); });
	toast((side==='me'?'':'对手')+'蛮巫祭礼：'+ROW_ZH[row]+'排 '+hit.length+' 张死士单位变身');
}

// 招降/伪令：收回己方场上一张非猛将单位
function startDecoyPick(){
	var candidates = fieldUnits(S.meField).filter(function(c){return !isHero(c);});
	if(!candidates.length){ toast('己方场上没有可招降的目标'); render(); afterAction(); return; }
	S.pending = {kind:'decoy'};
	showPrompt('招降：点击己方场上一张非猛将单位，收回手牌');
	render();
}
function resolveDecoyPick(name, row){
	if(!row) return;
	var list = S.meField[row];
	var card = list.find(function(c){ return c.name===name && !isHero(c); });
	if(!card) return;
	list.splice(list.indexOf(card),1);
	delete card._mod;
	S.hand.push(card);
	toast('招降：'+zhName(card)+' 回到手牌');
	S.pending = null; hidePrompt();
	render();
	afterAction();
}

// 归阵（打出医师单位后）/ 刘备领袖技（弃牌堆复活到手牌）：从弃牌堆选一张单位
function startMedicPick(toHandOnly, label){
	var candidates = S.meDiscard.filter(isUnit);
	var consumesTurn = !toHandOnly;
	if(!candidates.length){
		toast('弃牌堆没有可用的单位牌');
		if(consumesTurn) afterAction();
		return;
	}
	S.pending = {kind:'medic', toHand:!!toHandOnly, consumesTurn:consumesTurn, label:label||'仁德'};
	renderDiscardPanel(candidates, (S.pending.toHand? S.pending.label+'：选择复活到手牌的单位' : '归阵：选择复活上场的单位'));
	openDiscardPanel();
}
function resolveMedicPick(card){
	var wasConsumesTurn = S.pending.consumesTurn;
	var toHand = S.pending.toHand;
	var idx = S.meDiscard.indexOf(card); if(idx>=0) S.meDiscard.splice(idx,1);
	delete card._mod;
	if(toHand){ S.hand.push(card); toast(S.pending.label+'：'+zhName(card)+' 复活回到手牌'); }
	else { var row = card.row==='agile' ? 'close' : card.row; card._just=true; S.meField[row].push(card); toast('归阵：'+zhName(card)+' 重返战场'); }
	S.pending = null; closeDiscardPanel();
	render();
	if(wasConsumesTurn) afterAction();
}

function openDiscardView(){

document.getElementById('discardCards').addEventListener('click', function(e){

// 战场点击：待选状态下用于解析战鼓/伏击/招降的目标；否则弹卡牌详情
document.getElementById('fop').addEventListener('click', showFieldCard);
document.getElementById('fme').addEventListener('click', showFieldCard);
function showFieldCard(e){
	var cardEl = e.target.closest('.card');
	var rowEl = e.target.closest('.crow');
	var onMe = e.currentTarget.id==='fme';
	if(S.pending){
		if(S.pending.kind==='charm'){ if(!onMe && cardEl && rowEl) resolveCharmPick(cardEl.dataset.name, rowEl.dataset.row); return; }
		if(!onMe) return;
		if(S.pending.kind==='mardroeme' && rowEl){
			resolveMardroeme('me', rowEl.dataset.row);
			S.pending = null; hidePrompt(); render(); afterAction();
			return;
		}
		if(S.pending.kind==='horn' && rowEl){ resolveHornPick(rowEl.dataset.row); return; }
		if(S.pending.kind==='agile' && rowEl){
			var row = rowEl.dataset.row;
			if(row==='close'||row==='ranged') resolveAgilePick(row);
			else toast('该卡不能放到攻城排');
			return;
		}
		if(S.pending.kind==='decoy' && cardEl){ resolveDecoyPick(cardEl.dataset.name, rowEl?rowEl.dataset.row:null); return; }
		return;
	}
	if(!cardEl) return;
	var name = cardEl.dataset.name;
	var all = S.aiField.close.concat(S.aiField.ranged,S.aiField.siege,S.meField.close,S.meField.ranged,S.meField.siege);
	var c = all.find(function(x){return x.name===name});
	if(c) openModal(c);
}

// ========== 阵营与领袖（每局一次，不消耗出牌机会） ==========
// 技能规格取自原始数据表（cards-sanguo.js 里每位领袖的 keyword，即 CSV「关键词」列）。对表里写得模糊的地方，detail 里写明了实际采用的规则。
var FACTIONS = {
	shuhan:{name:'蜀汉', leaders:['刘备','刘禅']},
	caowei:{name:'曹魏', leaders:['曹操','司马懿']},
	dongwu:{name:'东吴', leaders:['孙权']},
	huangjin:{name:'黄巾', leaders:['张角']},
	qunxiong:{name:'群雄', leaders:['袁绍','马腾','孟获','刘表','袁术','公孙瓒']},
	hanting:{name:'汉廷', leaders:['左慈','貂蝉','汉献帝','皇甫嵩','朱隽','卢植','蔡邕']}
};
function factionName(f){ return FACTIONS[f] ? FACTIONS[f].name : ''; }
function findLeader(name){ return sanguo_card_dict.find(function(c){ return c.deck==='leader' && c.name===name; }); }
function isSpyUnit(c){ return isUnit(c) && c.ability && c.ability.indexOf('spy')>=0; }
function isMusterUnit(c){ return isUnit(c) && c.ability && c.ability.indexOf('muster')>=0; }
function byStrengthDesc(a,b){ return (parseInt(b.strength)||0)-(parseInt(a.strength)||0); }
function sideOpp(side){ return side==='me' ? 'ai' : 'me'; }
// 把"我方/对方"的各种状态按 side 取出来，让玩家和 AI 共用同一套技能实现
function SD(side){
	var me = side==='me';
	return {
		field: me?S.meField:S.aiField, opp: me?S.aiField:S.meField,
		hand: me?S.hand:S.aiHand, oppHand: me?S.aiHand:S.hand,
		disc: me?S.meDiscard:S.aiDiscard, oppDisc: me?S.aiDiscard:S.meDiscard,
		pool: me?MY_DECK_POOL:AI_DECK_POOL, horn: me?S.meHorn:S.aiHorn, oppHorn: me?S.aiHorn:S.meHorn,
		banished: me?S.meBanished:S.aiBanished
	};
}
function effPower(side, card){
	var T = SD(side), r = rowKeyOf(T.field, card);
	return r ? baseEffectivePower(card, r, T.field, S.weatherRows, T.horn) : (parseInt(card.strength)||0);
}
function drawFor(side, n){ if(side==='me') drawCards(n); else aiDraw(n); }
function markLeaderUsed(side){ if(side==='me') S.leaderUsed = true; else S.aiLeaderUsed = true; }
function leaderToast(side, msg){ toast((side==='me'?'领袖技：':'对手领袖技：')+msg); }
function removeFromField(field, card){
	var r = rowKeyOf(field, card);
	if(r) field[r].splice(field[r].indexOf(card),1);
	return r;
}
function putOnField(field, card, row){
	card._just = true;
	field[row==='agile'?'close':row].push(card);
}
function richestRow(side){
	var T = SD(side), best='close', bv=-1;
	['close','ranged','siege'].forEach(function(r){ var v=T.field[r].filter(function(c){return !isHero(c);}).length; if(v>bv){bv=v;best=r;} });
	return best;
}
function addAura(side, key, n){
	var f = SD(side).field; f.aura = f.aura || {};
	f.aura[key] = (f.aura[key]||0) + n;
}
function banishedBack(){
	if(S.meBanished.length){ S.hand = S.hand.concat(S.meBanished); S.meBanished = []; }
	if(S.aiBanished.length){ S.aiHand = S.aiHand.concat(S.aiBanished); S.aiBanished = []; }
}

// 刘备·仁德 / 刘表·荆襄固守：弃牌堆里选1张单位放回手牌
function reviveToHand(side, label){
	if(side==='me'){ markLeaderUsed('me'); startMedicPick(true, label); return; }
	var d = S.aiDiscard.filter(isUnit).sort(byStrengthDesc)[0]; if(!d) return;
	S.aiDiscard.splice(S.aiDiscard.indexOf(d),1); delete d._mod; S.aiHand.push(d);
	markLeaderUsed('ai'); leaderToast('ai', label+'：从弃牌堆召回了 '+zhName(d));
}
// 曹操·挟天子：把牌堆里战力最高的一张卧底牌直接放到对手半场
function leaderSpyDrop(side){
	var T = SD(side), card = T.pool.filter(isSpyUnit).sort(byStrengthDesc)[0];
	if(!card) return;
	T.pool.splice(T.pool.indexOf(card),1);
	putOnField(T.opp, card, card.row);
	markLeaderUsed(side); leaderToast(side, '挟天子：'+zhName(card)+' 混入'+(side==='me'?'对手':'你方')+'半场');
}
// 把某张单位从己方弃牌堆放到己方战场
function summonFromDiscard(side, card){
	var T = SD(side);
	T.disc.splice(T.disc.indexOf(card),1); delete card._mod;
	var row = card.row==='agile' ? 'close' : card.row;
	putOnField(T.field, card, row);
}

var LEADER_SKILL = {
	'刘备': {
		skill:'仁德', detail:'从己方弃牌堆中选择1张单位牌，放回手牌。', noTarget:'弃牌堆里还没有单位牌，暂时无法使用',
		can:function(side){ return SD(side).disc.some(isUnit); },
		use:function(side){ reviveToHand(side,'仁德'); },
		aiWhen:function(){ return S.round>=2; }
	},
	'刘禅': {
		skill:'守成', detail:'消灭对手场上战力最高的非猛将单位，并把它的战力作为额外点数加到你本回合的总战力上。', noTarget:'对手场上没有可消灭的非猛将单位',
		can:function(side){ return fieldUnits(SD(side).opp).some(function(c){return !isHero(c);}); },
		use:function(side){
			var T = SD(side), os = sideOpp(side);

function leaderCanUse(side){

	var used = side==='me'?S.leaderUsed:S.aiLeaderUsed;

	return !!(sk && !used && sk.can(side));
}
// 点领袖头像：先展示领袖信息与技能效果，确认后才使用；不满足条件时按钮置灰并说明原因
function leaderBlockReason(){
	var sk = LEADER_SKILL[S.leader.name];
	if(S.leaderUsed) return '本局已经使用过了';
	if(S.gameOver || S.turn!=='me' || S.mePassed) return '现在不是你的出牌回合';
	if(!sk.can('me')) return sk.noTarget || '当前无法使用';
	return '';
}
function openLeaderModal(){
	var c = S.leader, sk = LEADER_SKILL[c.name];
	var port = document.getElementById('leaderPort');
	port.setAttribute('style', artStyle(c,'md'));
	port.innerHTML = artName(c);
	document.getElementById('leaderName').textContent = c.name;
	document.getElementById('leaderFac').textContent = '领袖 · '+factionName(S.faction);
	document.getElementById('leaderSkill').textContent = '「'+sk.skill+'」每局一次';
	document.getElementById('leaderDesc').textContent = sk.detail+' 使用后不消耗你的出牌机会。';
	var why = leaderBlockReason();
	document.getElementById('leaderNote').textContent = why;
	document.getElementById('leaderUse').disabled = !!why;
	document.getElementById('leaderModal').classList.add('show');
}
function closeLeaderModal(){ document.getElementById('leaderModal').classList.remove('show'); }
document.getElementById('leader').addEventListener('click', function(){
	if(S.pending){ toast('请先完成当前操作'); return; }
	openLeaderModal();
});
document.getElementById('leaderCancel').addEventListener('click', closeLeaderModal);
document.getElementById('leaderModal').addEventListener('click', function(e){ if(e.target===this) closeLeaderModal(); });
document.getElementById('leaderUse').addEventListener('click', function(){

	closeLeaderModal();
	LEADER_SKILL[S.leader.name].use('me');

});

// ========== 回合推进：统一调度，避免"一方过牌后对方只行动一次就卡死" ==========
function updateTurnTagUI(){
	var tag = document.getElementById('turnTag');
	if(S.turn==='me'){ tag.textContent = S.mePassed? '等待对手…' : '你的回合'; tag.style.background='var(--gold)'; }
	else { tag.textContent = '对手回合'; tag.style.background='#555'; }
}
function afterAction(){
	if(S.gameOver) return;
	if(S.mePassed && S.aiPassed){ setTimeout(endRound, 800); return; }
	if(S.mePassed){ S.turn='ai'; updateTurnTagUI(); setTimeout(aiTurn, 900); return; }
	if(S.aiPassed){ S.turn='me'; updateTurnTagUI(); return; }
	if(S.turn==='me'){ S.turn='ai'; updateTurnTagUI(); setTimeout(aiTurn, 900); }
	else { S.turn='me'; updateTurnTagUI(); }
}

var AI_DECK_POOL = [];

// 按阵营 deck 取全部卡（含共享的特殊/天气牌），而不是按中文名手工列表——
// 避免"玩家抽卡池实际是曹魏卡组"这种阵营错配，也让 73 组同名银/铜卡都能被抽到。
function buildFactionPool(factionDeck){
	return sanguo_card_dict.filter(function(c){ return c.deck===factionDeck || c.deck==='special' || c.deck==='weather'; });
}
function shuffle(arr){
	for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
	return arr;
}
function drawCards(n){ for(var i=0;i<n;i++){ if(MY_DECK_POOL.length>0){ S.hand.push(MY_DECK_POOL.shift()); } } }
function aiDraw(n){ for(var i=0;i<n;i++){ if(AI_DECK_POOL.length>0){ S.aiHand.push(AI_DECK_POOL.shift()); } } }

function aiEvaluateCard(card){
  if(card.deck==='weather'){
    if(card.ability==='frost'){ return rowDiff('close'); }
    if(card.ability==='fog'){ return rowDiff('ranged'); }
    if(card.ability==='rain'){ return rowDiff('siege'); }
    if(card.ability==='skellestorm'){ return rowDiff('ranged')+rowDiff('siege'); }
    if(card.ability==='clear'){ var active=S.weatherRows.close||S.weatherRows.ranged||S.weatherRows.siege; return active?5:-10; }
  }
  if(card.deck==='special'){
    if(card.ability==='scorch'){
      var mine = Math.max.apply(null, fieldUnits(S.meField).filter(function(c){return !isHero(c);}).map(function(c){return baseEffectivePower(c, rowKeyOf(S.meField,c), S.meField, S.weatherRows, S.meHorn);}).concat([0]));
      var ours = Math.max.apply(null, fieldUnits(S.aiField).filter(function(c){return !isHero(c);}).map(function(c){return baseEffectivePower(c, rowKeyOf(S.aiField,c), S.aiField, S.weatherRows, S.aiHorn);}).concat([0]));
      return mine>=ours ? mine : -5;
    }
    if(card.ability==='horn') return 8;
    if(card.ability==='decoy') return 3;
    return 2;
  }
  var score=parseInt(card.strength)||0;
  if(card.ability&&card.ability.indexOf('bond')>=0){ var sn=S.aiField[card.row==='agile'?'close':card.row].filter(function(c){return c.name===card.name}).length; score+=sn*score; }
  if(card.ability&&card.ability.indexOf('hero')>=0) score+=2;
  if(card.ability&&card.ability.indexOf('spy')>=0) score+=5;
  if(card.ability&&card.ability.indexOf('medic')>=0) score+=4;
  if(card.ability&&card.ability.indexOf('muster')>=0) score+=3;
  return score;
}
function rowDiff(row){
  var mc = S.meField[row].reduce(function(s,c){return s+baseEffectivePower(c,row,S.meField,S.weatherRows,S.meHorn);},0);
  var ac = S.aiField[row].reduce(function(s,c){return s+baseEffectivePower(c,row,S.aiField,S.weatherRows,S.aiHorn);},0);
  return mc-ac;
}

function aiChooseCard(){
  var hand=S.aiHand;
  if(hand.length===0) return null;
  if(S.difficulty==='easy'){
    var units=hand.filter(function(c){return isUnit(c)});
    var pool=units.length?units:hand;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  if(S.difficulty==='normal'){
    var weathers=hand.filter(function(c){return c.deck==='weather'});
    for(var i=0;i<weathers.length;i++){ var w=weathers[i];
      if(w.ability==='frost'&&S.meField.close.length>=2) return w;
      if(w.ability==='fog'&&S.meField.ranged.length>=2) return w;
      if(w.ability==='rain'&&S.meField.siege.length>=2) return w;
      if(w.ability==='clear'&&(S.weatherRows.close||S.weatherRows.ranged||S.weatherRows.siege)) return w;
    }
    var units2=hand.filter(function(c){return isUnit(c)}).sort(function(a,b){return parseInt(b.strength)-parseInt(a.strength)});
    if(units2.length) return units2[0];
    var sp=hand.filter(function(c){return c.deck==='special'});
    if(sp.length) return sp[0];
    return hand[0];
  }
  var best=null,bestScore=-999;
  for(var j=0;j<hand.length;j++){ var sc=aiEvaluateCard(hand[j]); if(sc>bestScore){bestScore=sc;best=hand[j];} }
  var aiTotal=computeSidePower(S.aiField,S.weatherRows,S.aiHorn).total, meTotal=computeSidePower(S.meField,S.weatherRows,S.meHorn).total;
  if(bestScore<3&&aiTotal>meTotal&&S.aiHand.length<=3) return null;
  return best;
}

function shouldAiPass(){
  var aiTotal=computeSidePower(S.aiField,S.weatherRows,S.aiHorn).total, meTotal=computeSidePower(S.meField,S.weatherRows,S.meHorn).total;
  var dif=aiTotal-meTotal;
  if(S.difficulty==='easy') return S.aiHand.length===0||(dif>20&&Math.random()<0.3);
  if(S.difficulty==='normal'){ if(S.aiHand.length===0)return true; if(S.mePassed&&dif>0)return true; if(dif>25)return true; return false; }
  if(S.aiHand.length===0)return true;
  if(S.mePassed&&dif>0)return true;
  if(dif>20&&S.aiHand.length<=2)return true;
  return false;
}

// AI 版的战鼓/招降/伏击排/归阵——没有 UI，直接用简单启发式决策
function aiChooseAgileRow(){
  var c = rowDiff('close'), r = rowDiff('ranged');
  return c<=r ? 'close' : 'ranged';
}
function aiResolveHorn(){
  var rows=['close','ranged','siege'], best='close', bestVal=-1;
  rows.forEach(function(r){ if(S.aiHorn[r]) return; var v=S.aiField[r].filter(function(c){return !isHero(c);}).length; if(v>bestVal){bestVal=v;best=r;} });
  S.aiHorn[best]=true;
  toast('对手使用战鼓，强化了'+ROW_ZH[best]+'排');
}
function aiResolveDecoy(){
  var candidates = fieldUnits(S.aiField).filter(function(c){return !isHero(c);});
  if(!candidates.length){ toast('对手使用招降（场上没有可用目标）'); return; }
  var best=null,bestP=Infinity;
  candidates.forEach(function(c){ var r=rowKeyOf(S.aiField,c); var p=baseEffectivePower(c,r,S.aiField,S.weatherRows,S.aiHorn); if(p<bestP){bestP=p;best=c;} });
  var r=rowKeyOf(S.aiField,best);
  S.aiField[r].splice(S.aiField[r].indexOf(best),1);
  delete best._mod;
  S.aiHand.push(best);
  toast('对手使用招降，收回了 '+zhName(best));
}
function aiResolveMedic(){
  var candidates = S.aiDiscard.filter(isUnit);
  if(!candidates.length) return;
  candidates.sort(function(a,b){return (parseInt(b.strength)||0)-(parseInt(a.strength)||0);});
  var pick = candidates[0];
  S.aiDiscard.splice(S.aiDiscard.indexOf(pick),1);
  var row = pick.row==='agile' ? aiChooseAgileRow() : pick.row;
  pick._just=true; S.aiField[row].push(pick);
  toast('对手使用归阵，复活了 '+zhName(pick));
}
// AI 的领袖技：按各领袖技能自带的时机（曹操第1回合、刘备等弃牌堆有牌的后续回合）自动使用一次
function aiUseLeaderIfNeeded(){
  if(!S.aiLeader || S.aiLeaderUsed) return;
  var sk = LEADER_SKILL[S.aiLeader.name];
  if(!sk || !sk.can('ai') || !sk.aiWhen()) return;
  sk.use('ai');
  render();
}

function aiPlayCard(card){
  var idx=S.aiHand.indexOf(card); if(idx>=0)S.aiHand.splice(idx,1);
  S.last.ai = card;
  if(isUnit(card)){
    var row = card.row==='agile' ? aiChooseAgileRow() : card.row;
    placeUnitCard(card, row, 'ai');
    return;
  } else if(card.deck==='weather'){
    applyWeatherCard(card, 'ai');
    toast(card.ability==='clear' ? '对手使用：放晴' : '对手使用天气：'+zhName(card));
  } else if(card.deck==='special'){
    toDiscard('ai', card);
    if(card.ability==='horn') aiResolveHorn();
    else if(card.ability==='decoy') aiResolveDecoy();
    else if(card.ability==='mardroeme') resolveMardroeme('ai', richestRow('ai'));
    else if(card.ability==='scorch'){ var v=resolveScorch(); toast(v.length? '对手使用烧灼，摧毁了 '+v.map(zhName).join('、') : '对手使用烧灼（无目标）'); }
    else toast('对手使用：'+zhName(card));
  }
  render();
  afterAction();
}

function aiPass(){
  S.aiPassed=true; toast('对手选择过牌'); render();
  afterAction();
}

function aiTurn(){
  if(S.gameOver)return;
  setTimeout(function(){
    if(S.aiPassed){endRound();return;}
    aiUseLeaderIfNeeded();
    var card=aiChooseCard();
    if(card===null||shouldAiPass()){aiPass();return;}
    aiPlayCard(card);
  },1200);
}

function endRound(){
  var meScore=computeSidePower(S.meField,S.weatherRows,S.meHorn).total, aiScore=computeSidePower(S.aiField,S.weatherRows,S.aiHorn).total;
  S.roundScores.push({me:meScore,ai:aiScore});
  if(meScore>aiScore){S.aiGems--;toast('第'+S.round+'回合：你赢了 ('+meScore+' vs '+aiScore+')');}
  else if(aiScore>meScore){S.meGems--;toast('第'+S.round+'回合：你输了 ('+meScore+' vs '+aiScore+')');}
  else{S.meGems--;S.aiGems--;toast('第'+S.round+'回合：平局');}
  // 回合结束：场上单位进弃牌堆（张角「苍天已死」的单位直接被摧毁，不进弃牌堆；复制品也不进）
  ['me','ai'].forEach(function(s){
    var f = s==='me'?S.meField:S.aiField;
    fieldUnits(f).forEach(function(c){ delete c._mod; if(!f.cursed) toDiscard(s, c); });
  });
  flushWeatherToDiscard();
  render();
  if(S.meGems<=0||S.aiGems<=0||S.round>=3){setTimeout(endGame,1500);}
  else{S.round++;setTimeout(startNewRound,1500);}
}

function startNewRound(){
  S.meField={close:[],ranged:[],siege:[]}; S.aiField={close:[],ranged:[],siege:[]};
  S.weatherRows={close:null,ranged:null,siege:null};
  S.meHorn={close:false,ranged:false,siege:false};
  S.aiHorn={close:false,ranged:false,siege:false};
  S.mePassed=false; S.aiPassed=false; S.turn='me'; S.pending=null; hidePrompt();
  S.last = {me:null, ai:null};
  updateTurnTagUI();
  banishedBack(); // 司马懿「隐忍」撤出的单位回到手牌
  drawCards(2); aiDraw(2); render(); toast('第'+S.round+'回合开始');
}

function endGame(){
  S.gameOver=true;
  var r=document.getElementById('endResult'),rs=document.getElementById('endRounds');
  var mw=2-S.meGems,aw=2-S.aiGems;
  if(S.meGems>S.aiGems){r.textContent='胜利';r.className='result win';}
  else if(S.aiGems>S.meGems){r.textContent='失败';r.className='result lose';}
  else{r.textContent='平局';r.className='result draw';}

}

function startNewGame(){

  S.meField={close:[],ranged:[],siege:[]};S.aiField={close:[],ranged:[],siege:[]};

  var others = Object.keys(FACTIONS).filter(function(f){ return f!==S.faction; });

  var myAll = shuffle(S.deckIds.map(findCardById).filter(Boolean));

  S.hand = myAll.splice(0,10);

var DECK_RULES = {unitMin:15, specialMax:8, totalMax:30};
S.faction = 'shuhan';
S.leaderName = '刘备';
S.deckIds = [];
S.deckFilter = 'all';

// 可选卡池：本阵营单位 + 通用特殊/天气牌
function deckPool(faction){
	return sanguo_card_dict.filter(function(c){
		return c.deck===faction || c.deck==='special' || c.deck==='weather';
	});
}
function isSpecialCard(c){ return c.deck==='special' || c.deck==='weather'; }
function sortForDeck(list){
	return list.slice().sort(function(a,b){
		var sa = isSpecialCard(a)?1:0, sb = isSpecialCard(b)?1:0;
		if(sa!==sb) return sa-sb;
		var ha = isHero(a)?0:1, hb = isHero(b)?0:1;
		if(ha!==hb) return ha-hb;
		return (parseInt(b.strength)||0)-(parseInt(a.strength)||0) || a.id-b.id;
	});
}
// 推荐牌组：全部猛将 + 战力最高的单位凑够 22 张，再配战鼓/招降/烧灼/寒潮/大雾/放晴（死士多的阵营再加蛮巫祭礼）
function recommendedDeckIds(faction){
	var pool = deckPool(faction);
	var units = sortForDeck(pool.filter(function(c){ return !isSpecialCard(c); })).slice(0,22);
	var wantAbility = ['horn','decoy','scorch','frost','fog','clear'];
	if(units.filter(isMusterUnit).length>=4) wantAbility.push('mardroeme');
	var specials = [];
	wantAbility.forEach(function(ab){
		var c = pool.find(function(x){ return isSpecialCard(x) && x.ability===ab && specials.indexOf(x)<0; });
		if(c) specials.push(c);
	});
	return units.concat(specials).map(function(c){ return c.id; });
}
function deckCounts(){
	var units=0, specials=0;
	S.deckIds.forEach(function(id){ var c=findCardById(id); if(!c) return; if(isSpecialCard(c)) specials++; else units++; });
	return {units:units, specials:specials, total:units+specials};
}
function saveDeck(){
	try{
		localStorage.setItem('3kun_deck_'+S.faction, JSON.stringify(S.deckIds));
		localStorage.setItem('3kun_leader_'+S.faction, S.leaderName);
		localStorage.setItem('3kun_faction', S.faction);
	}catch(e){}
}
function loadDeck(faction){
	try{
		var raw = localStorage.getItem('3kun_deck_'+faction);
		if(raw){
			var ids = JSON.parse(raw), valid = {};
			deckPool(faction).forEach(function(c){ valid[c.id]=1; });
			ids = ids.filter(function(id){ return valid[id]; });
			if(ids.length) return ids;
		}
	}catch(e){}
	return recommendedDeckIds(faction);
}
function loadLeader(faction){
	var list = FACTIONS[faction].leaders, name = '';
	try{ name = localStorage.getItem('3kun_leader_'+faction) || ''; }catch(e){}
	return list.indexOf(name)>=0 ? name : list[0];
}

// 卡牌左上角图标：单位=所在排+技能；天气=天气图标；特殊=技能图标
function deckIcons(c){
	if(c.deck==='weather') return weatherIconHTML(c);
	return rowIconHTML(c.row) + abilityIconHTML(c.ability);
}

function renderDeckScreen(){
	// 阵营
	document.getElementById('dkFactions').innerHTML = Object.keys(FACTIONS).map(function(f){
		return '<div class="fchip'+(S.faction===f?' on':'')+'" data-f="'+f+'">'+FACTIONS[f].name+'</div>';
	}).join('');
	// 领袖（同阵营有多位时可选）
	var leaders = FACTIONS[S.faction].leaders;
	var lbox = document.getElementById('dkLeaders');
	lbox.style.display = leaders.length>1 ? '' : 'none';
	lbox.innerHTML = leaders.map(function(n){
		var sk = LEADER_SKILL[n];
		return '<div class="lchip'+(S.leaderName===n?' on':'')+'" data-l="'+n+'">'+n+'<small>'+sk.skill+'</small></div>';
	}).join('');
	var lead = findLeader(S.leaderName), sk = LEADER_SKILL[lead.name];
	document.getElementById('dkLeader').innerHTML = '<div class="lav" style="'+artStyle(lead,'sm')+'"></div>'
		+'<div class="linfo"><div class="ln">领袖：'+lead.name+' · 「'+sk.skill+'」每局一次</div><div class="ls">'+sk.detail+'</div></div>';
	// 统计
	var cnt = deckCounts(), rule = DECK_RULES;
	var okUnits = cnt.units>=rule.unitMin;
	document.getElementById('dkStat').innerHTML = '<span>已选 <b>'+cnt.total+'</b> / '+rule.totalMax+'</span>'
		+'<span class="'+(okUnits?'':'bad')+'">单位 '+cnt.units+'（至少'+rule.unitMin+'）</span>'
		+'<span class="'+(cnt.specials>rule.specialMax?'bad':'')+'">特殊/天气 '+cnt.specials+' / '+rule.specialMax+'</span>';
	document.getElementById('dkStart').disabled = !(okUnits && cnt.specials<=rule.specialMax && cnt.total<=rule.totalMax);
	// 筛选
	var filters = [['all','全部'],['close','近战'],['ranged','远程'],['siege','攻城'],['special','特殊/天气']];
	document.getElementById('dkFilters').innerHTML = filters.map(function(f){
		return '<div class="ft'+(S.deckFilter===f[0]?' on':'')+'" data-ft="'+f[0]+'">'+f[1]+'</div>';
	}).join('');
	// 卡池
	var chosen = {}; S.deckIds.forEach(function(id){ chosen[id]=1; });
	var list = sortForDeck(deckPool(S.faction)).filter(function(c){
		var f = S.deckFilter;
		if(f==='all') return true;
		if(f==='special') return isSpecialCard(c);
		if(isSpecialCard(c)) return false;
		return c.row===f || (c.row==='agile' && (f==='close'||f==='ranged'));
	});
	document.getElementById('dkGrid').innerHTML = list.map(function(c){
		var ab = abilityNames(c);
		return '<div class="dk-cell'+(chosen[c.id]?' sel':'')+(isHero(c)?' hero':'')+(isSpecialCard(c)?' sp':'')+'" data-id="'+c.id+'">'
			+'<div class="dk-art" style="'+artStyle(c,'sm')+'">'+artName(c)
			+(c.strength?'<div class="dpw">'+c.strength+'</div>':'')
			+deckIcons(c)
			+'<div class="dchk">✓</div></div>'
			+'<div class="dn">'+c.name+'</div><div class="da">'+ab.join('·')+'</div></div>';
	}).join('');
}

	S.leaderName = loadLeader(S.faction);

	+'<p>左上角的数字是<b>战力</b>；金色边框是<b>猛将</b>（不受天气、烧灼、战鼓影响）；数字下面的小图标是<b>兵种排</b>和<b>技能</b>。点战场上的牌能看大图和技能说明。</p>'
	+'<h3>领袖、牌堆与弃牌堆</h3>'
	+'<p><b>领袖</b>：每局可以用一次技能，使用后不消耗出牌机会。点领袖头像先看效果，确认后才使用。</p>'
	+'<p><b>牌堆</b>：开局从你选的牌组里随机抽10张作手牌，其余留在牌堆，每回合开始再各抽2张。</p>'
	+'<p><b>弃牌堆</b>：打出的特殊牌、被消灭的单位、每回合结束时的场面都会进弃牌堆，点底部右下角可查看。有些技能能把里面的单位救回来。</p>';
}
function helpSkillsHTML(){
	var order = ['hero','bond','morale','medic','spy','muster','agile','purify','horn','decoy','scorch','mardroeme','frost','fog','rain','skellestorm','clear'];
	var tag = {horn:'特殊牌',decoy:'特殊牌',scorch:'特殊牌',mardroeme:'特殊牌',frost:'天气牌',fog:'天气牌',rain:'天气牌',skellestorm:'天气牌',clear:'天气牌'};
	return '<p style="color:var(--ink-dim)">卡牌上的小图标就是这些技能。选牌或手牌里每张牌下面也写着技能名。</p>'
	+order.map(function(k){
		var full = ABILITY[k] || '';
		var desc = full.replace(/^[^：]*：/,'');
		return '<div class="item"><div class="ic">'+helpIconHTML(k)+'</div><div><div class="nm">'+ABILITY_NAME[k]+(tag[k]?'<span class="tg">'+tag[k]+'</span>':'')+'</div><div class="ds">'+desc+'</div></div></div>';
	}).join('');
}
function helpLeadersHTML(){
	return '<p style="color:var(--ink-dim)">每位领袖每局可以用一次技能（不消耗出牌机会）。选牌组时可以挑选自己的领袖。</p>'
	+Object.keys(FACTIONS).map(function(f){
		return '<h3>'+FACTIONS[f].name+'</h3>'+FACTIONS[f].leaders.map(function(n){
			var sk = LEADER_SKILL[n], c = findLeader(n);
			return '<div class="item"><div class="lav" style="'+artStyle(c,'sm')+'"></div><div><div class="nm">'+n+' · 「'+sk.skill+'」</div><div class="ds">'+sk.detail+'</div></div></div>';
		}).join('');
	}).join('');
}
function helpTipsHTML(){
	return '<h3>新手小贴士</h3>'
	+'<p>• <b>别把好牌一次打光</b>。三局两胜，第一局可以少出牌、探探对手，甚至故意输掉，把强牌留给后面。</p>'
	+'<p>• <b>过牌的时机很重要</b>。当你已经领先、对手又要花很多牌才能追上时，果断过牌，把手牌留到下一局。</p>'
	+'<p>• <b>天气牌对双方都有效</b>：寒潮压制近战、大雾压制远程、暴雨压制攻城，把该排的普通单位战力变成1（猛将不受影响）。先看看谁的那一排更强再打。</p>'
	+'<p>• <b>同袍呼应</b>的牌要凑齐同名才厉害，同排放2张战力翻倍、3张三倍。</p>'
	+'<p>• <b>战鼓</b>要放在牌最多的那一排，翻倍才划算；<b>烧灼</b>会消灭场上最强的牌——先看看是不是对手的。</p>'
	+'<p>• <b>卧底</b>牌会放到对手半场，给对手加战力，但你能抽2张牌。适合在对手那排很弱时用。</p>'
	+'<p>• <b>归阵</b>（医师）能从弃牌堆救回单位，最好等弃牌堆里有高战力牌再打。</p>'
	+'<p>• 选牌组时，点「推荐牌组」可以直接套用一套比较均衡的组合，之后再微调。</p>';
}
var helpTab = 'rules';
function renderHelp(){
	document.querySelectorAll('#helpTabs .ht').forEach(function(t){ t.classList.toggle('on', t.dataset.t===helpTab); });
	var body = document.getElementById('helpBody');
	body.innerHTML = helpTab==='rules' ? helpRulesHTML() : helpTab==='skills' ? helpSkillsHTML() : helpTab==='leaders' ? helpLeadersHTML() : helpTipsHTML();
	body.scrollTop = 0;
}
function openHelp(tab){ helpTab = tab || helpTab; renderHelp(); document.getElementById('helpPanel').classList.add('show'); }
function closeHelp(){ document.getElementById('helpPanel').classList.remove('show'); }
document.getElementById('helpTabs').addEventListener('click', function(e){
	var t = e.target.closest('.ht'); if(!t) return;
	helpTab = t.dataset.t; renderHelp();
});
document.getElementById('helpClose').addEventListener('click', closeHelp);
document.getElementById('helpBtn').addEventListener('click', function(){ openHelp(); });
document.getElementById('helpStartBtn').addEventListener('click', function(){ openHelp('rules'); });
document.getElementById('helpReplay').addEventListener('click', function(){
	var inGame = document.getElementById('startScreen').classList.contains('hide') && document.getElementById('deckScreen').classList.contains('hide');
	if(!inGame){ toast('进入对局后会自动播放新手引导'); return; }
	closeHelp(); startCoach();
});

// ========== 新手引导（第一次进入对局自动播放，可在帮助里重看） ==========
var COACH_STEPS = [
	{sel:null, title:'欢迎来到三坤牌', text:'这是三国版昆特牌：你和对手轮流出牌，比谁的「总战力」更高。<b>三局两胜</b>，先赢两局的人获胜。花1分钟看看怎么玩吧。'},
	{sel:'#opbar', title:'对手信息', text:'这里是对手：头像、<b>总战力</b>（他场上所有牌的战力之和）、手牌数、第几局。右边两颗红宝石是他剩的「命」，每输一局掉一颗。'},
	{sel:'#fme', title:'你的战场', text:'战场分<b>近战、远程、攻城</b>三排，每张牌只能放进自己对应的那一排，右边的数字是这一排的战力。上面三排是对手的。'},
	{sel:'#handStack', title:'你的手牌', text:'底部是你的手牌。<b>点任意一张</b>展开，卡牌下方有名称和技能，选中后点「出牌」（或再点一次那张牌）。'},
	{sel:'#tot', title:'总战力 = 比分', text:'这是你的<b>总战力</b>。和对手顶部的总战力对比，本回合谁更高，谁就赢下这一局。'},
	{sel:'#pass', title:'过牌', text:'不想再出牌时点「过牌」。过牌后你本回合不能再出牌，对手会继续出牌直到他也过牌，然后比总战力。<b>别把好牌一次打光</b>，留到后面几局。'},
	{sel:'#leader', title:'领袖', text:'这是你的领袖，<b>每局可以用一次技能</b>，使用后不消耗出牌机会。点头像先看技能效果，确认后才会使用。'},
	{sel:'#discardPile', title:'弃牌堆', text:'打出的特殊牌、被消灭的单位、每回合结束时的场面都会进弃牌堆，点开可以查看。有些技能（归阵、仁德）能把里面的单位救回来。'},
	{sel:'#helpBtn', title:'随时求助', text:'右边这个「?」随时可以打开：<b>玩法说明、全部技能图鉴、领袖技能表</b>。祝你旗开得胜！'}
];
var coach = {i:0};
function startCoach(){
	coach.i = 0;
	document.getElementById('coach').classList.add('show');
	coachRender();
}
function endCoach(){
	document.getElementById('coach').classList.remove('show');
	try{ localStorage.setItem('3kun_tutorial_done','1'); }catch(e){}
}
function coachRender(){
	var st = COACH_STEPS[coach.i], last = coach.i===COACH_STEPS.length-1;
	var root = document.getElementById('coach'), spot = document.getElementById('coachSpot'), tip = document.getElementById('coachTip');
	document.getElementById('coachStep').textContent = '新手引导  '+(coach.i+1)+' / '+COACH_STEPS.length;
	document.getElementById('coachTitle').textContent = st.title;
	document.getElementById('coachText').innerHTML = st.text;
	document.getElementById('coachPrev').style.display = coach.i===0 ? 'none' : '';
	document.getElementById('coachSkip').style.display = last ? 'none' : '';
	document.getElementById('coachNext').textContent = last ? '开始游戏' : '下一步';
	var vh = window.innerHeight, t = st.sel ? document.querySelector(st.sel) : null;
	tip.style.top = 'auto'; tip.style.bottom = 'auto';
	if(!t){
		root.style.background = 'rgba(0,0,0,.78)';
		spot.style.display = 'none';
		tip.style.top = Math.max(20, vh/2 - tip.offsetHeight/2) + 'px';
		return;
	}
	root.style.background = 'transparent';
	var r = t.getBoundingClientRect(), pad = 5;
	spot.style.display = 'block';
	spot.style.left = (r.left-pad)+'px'; spot.style.top = (r.top-pad)+'px';
	spot.style.width = (r.width+pad*2)+'px'; spot.style.height = (r.height+pad*2)+'px';
	var th = tip.offsetHeight;
	if(r.bottom + 14 + th <= vh - 10) tip.style.top = (r.bottom+14)+'px';
	else if(r.top - 14 - th >= 10) tip.style.bottom = (vh - r.top + 14)+'px';
	else tip.style.bottom = '10px';
}
document.getElementById('coachNext').addEventListener('click', function(){
	if(coach.i>=COACH_STEPS.length-1){ endCoach(); return; }
	coach.i++; coachRender();
});
document.getElementById('coachPrev').addEventListener('click', function(){ if(coach.i>0){ coach.i--; coachRender(); } });
document.getElementById('coachSkip').addEventListener('click', endCoach);
function maybeStartTutorial(){
	var done = false;
	try{ done = localStorage.getItem('3kun_tutorial_done')==='1'; }catch(e){}
	if(!done) setTimeout(startCoach, 700);
}

// 启动（等待用户点击开始）
</script>
